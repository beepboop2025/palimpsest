name: Tests

# The test suite, run as a gate rather than as advice. Until this existed, every
# guard test in the repo — including tests/test_no_dangerous_sinks.py, which is the
# thing standing between a future edit and a code-execution sink on a collection
# path — could only fail on someone's laptop. A guard that cannot fail the build is
# documentation, not a guard.
#
# Two suites, one command:
#   tests/            — the observatory's own suite, including strict JSON Schema
#                       publication contracts.
#   censorwatch/tests — the velocity leg's suite, which DOES need the installed
#                       dependencies (pandas et al.); it is only meaningful after
#                       `pip install -r requirements.txt`, which is why this
#                       workflow installs before running rather than relying on the
#                       stdlib-only invocation the README documents for local use.
#
# The test and publication-contract jobs are offline. After those gates pass on
# an exact main push, a separate least-privilege job collects one public WDI
# response and emits an attested, review-only China economic handoff. Those bytes
# are uploaded as a workflow artifact and are never added to the Pages edition.

# Feature heads are tested by the pull_request event. Restricting push runs to
# main prevents the same commit from consuming two full CI runs while preserving
# the post-merge gate. Scheduled publishers explicitly dispatch the exact SHA they
# put on main because GitHub suppresses ordinary push events created by GITHUB_TOKEN.
on:
  push:
    branches:
      - main
  pull_request:
  repository_dispatch:
    types:
      - publication_contract

permissions:
  contents: read

concurrency:
  # A publication-only commit must not cancel a long-running product suite or a
  # distinct publication. Duplicate delivery for the same payload SHA remains
  # self-cancelling.
  group: >-
    tests-${{ github.event_name }}-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || github.ref }}-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.scope || 'push' }}-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.scope == 'source' && 'contract-only' || 'full' }}
  cancel-in-progress: true

jobs:
  pytest:
    # Source dispatches are deliberately incomplete and cannot deploy. Every
    # deployable complete dispatch, ordinary push, and pull request runs the full
    # suite, regardless of commit-message markers, so newly merged code cannot be
    # carried into production by a faster data-only dispatch.
    if: ${{ github.event_name != 'repository_dispatch' || github.event.client_payload.scope == 'complete' }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # The MCP provenance tests read one exact authentic GitHub-signed
          # merge object without storing its personal identity in the Pages tree.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + test dependencies
        # censorwatch/tests need these; tests/ deliberately does not.
        run: pip install --quiet -r requirements.txt

      - name: Exercise the validated backup contract
        run: |
          bash -n \
            ops/backup/palimpsest-backup.sh \
            ops/backup/test-backup.sh \
            ops/backup/palimpsest-node-offsite-backup.sh \
            ops/node-offsite/install-host-bundle.sh
          sh -n ops/node-offsite/verify-host-bundle.sh
          test "$(grep -c '^OnSuccess=palimpsest-node-offsite-backup.service$' \
            ops/systemd/palimpsest-backup.offsite-trigger.conf)" = 1
          bash ops/backup/test-backup.sh
          python -m pytest -q \
            tests/test_node_backup_snapshot.py \
            tests/test_node_offsite_backup.py \
            tests/test_node_offsite_deployment.py

      - name: Run the full suite
        run: python -m pytest tests/ censorwatch/tests/ -q

  contract:
    # THE READING VALIDATORS. This job has no skip guard. Action-token publishers
    # dispatch the accepted SHA explicitly, and human pushes arrive through push.
    #
    # It also runs the three integrity verifiers. Those live inside erasure-refresh today,
    # so a change that breaks the ledger verifier is caught only if it happens to touch that
    # workflow — the one guarantee the project asks readers to check for themselves should
    # not depend on which cron fired.
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.identity.outputs.revision }}
      scope: ${{ steps.identity.outputs.scope }}
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Resolve and validate the publication identity
        id: identity
        env:
          PUBLICATION_SHA: ${{ github.event.client_payload.sha }}
          PUBLICATION_SCOPE: ${{ github.event.client_payload.scope }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            publication_sha=$PUBLICATION_SHA
            publication_scope=$PUBLICATION_SCOPE
          else
            publication_sha=$GITHUB_SHA
            publication_scope=complete
          fi
          if [ "${#publication_sha}" -ne 40 ] ||
             [ -n "${publication_sha//[0-9a-f]/}" ]; then
            echo "invalid publication SHA" >&2
            exit 1
          fi
          case "$publication_scope" in
            source|complete) ;;
            *)
              echo "invalid publication scope" >&2
              exit 1
              ;;
          esac
          {
            echo "revision=$publication_sha"
            echo "scope=$publication_scope"
          } >> "$GITHUB_OUTPUT"
          if [ "$publication_scope" = "source" ] &&
             [ "$GITHUB_EVENT_NAME" != "repository_dispatch" ]; then
            echo "source scope is accepted only through exact repository dispatch" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ steps.identity.outputs.revision }}
          fetch-depth: 0

      - name: Prove the dispatched commit is published on main
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          PUBLICATION_SHA: ${{ github.event.client_payload.sha }}
          PUBLICATION_SCOPE: ${{ github.event.client_payload.scope }}
        run: |
          test "$(git rev-parse HEAD)" = "$PUBLICATION_SHA"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$PUBLICATION_SHA" origin/main; then
            echo "dispatched publication is not reachable from main" >&2
            exit 1
          fi
          if [ "$PUBLICATION_SCOPE" = "complete" ] &&
             [ "$(git rev-parse origin/main)" != "$PUBLICATION_SHA" ]; then
            echo "complete publication is not the current main tip" >&2
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the hash-pinned contract environment
        # NOT -r requirements.txt. The contract job needs pytest plus JSON Schema and its
        # format validators, all pinned to reviewed Python 3.12 Linux wheel hashes.
        run: pip install --quiet --require-hashes -r .github/osint-china-ci-requirements.txt

      - name: Validate publication metadata and source closure
        run: |
          python -m pytest -q tests/test_publication_contract.py
          python -m scripts.build_data_catalog --check
          python scripts/seal_readings.py --check

      - name: Validate the complete derived edition
        if: ${{ steps.identity.outputs.scope == 'complete' }}
        run: |
          python -m pytest -q \
            tests/test_erasure_layer_freshness.py \
            tests/test_board_stale_is_not_calm.py \
            tests/test_cadence_matches_crons.py \
            tests/test_method_version_guard.py \
            tests/test_eval_assurance.py \
            tests/test_eval_journal.py \
            tests/test_econ_ledger.py::test_published_schema_accepts_every_current_ledger_row \
            tests/test_world_bank_wdi.py \
            tests/test_china_econ_export.py \
            tests/test_china_econ_manifest.py::test_manifest_schema_accepts_generated_public_and_fixture_documents \
            tests/test_china_econ_forecast_publish.py::test_strict_schema_accepts_the_public_artifact \
            tests/test_china_site.py::test_json_schema_is_valid_and_validates_the_index \
            tests/test_china_situation.py \
            tests/test_erasure_trail.py \
            tests/test_event_interconnection.py \
            tests/test_mcp_deployment.py

      - name: Check the committed deterministic machine-newsroom graph
        if: ${{ steps.identity.outputs.scope == 'complete' }}
        run: |
          # These checks MUST precede every write-mode builder below. Otherwise a
          # tampered committed artifact could be silently replaced and then pass its
          # check against the just-written bytes.
          #
          # The partner aggregate is admitted only through its separately reviewed,
          # hash-bound supersession receipt. CI validates that pin and never fetches
          # or auto-admits replacement partner bytes.
          python -m scripts.sync_narcoscope --check
          python -m core.evidence_mesh --check
          python -m core.machine_investigations --check
          python -m scripts.build_newsroom --check
          python -m scripts.build_china_econ_manifest --check
          python -m scripts.build_china_econ_forecast --check
          python -m scripts.build_china_site --check
          python -m scripts.build_data_catalog --check
          python -m scripts.build_china_situation --check
          python -m scripts.build_erasure_trail --check
          python scripts/seal_readings.py --check

      - name: Rebuild and prove the deterministic graph is unchanged
        if: ${{ steps.identity.outputs.scope == 'complete' }}
        run: |
          # Replay the already validated mesh at its recorded publication
          # clock.  A no-argument build intentionally means "publish a new
          # snapshot now" and therefore cannot prove byte reproducibility.
          mesh_clock=$(python -c 'import json; print(json.load(open("readings/evidence-mesh-latest.json"))["generated_at"])')
          catalog_clock=$(python -c 'import json; print(json.load(open("readings/catalog.json"))["generated_at"])')
          python -m core.evidence_mesh --now "$mesh_clock"
          python -m core.machine_investigations
          python -m scripts.build_newsroom
          python -m scripts.build_china_econ_manifest
          python -m scripts.build_china_econ_forecast
          python -m scripts.build_china_site
          python -m scripts.build_data_catalog --now "$catalog_clock"
          python -m scripts.build_china_situation
          python -m scripts.build_erasure_trail
          managed_status="$(git status --porcelain=v1 --untracked-files=all -- \
            readings china news datapackage.json)"
          if [ -n "$managed_status" ]; then
            printf '%s\n' "$managed_status" >&2
            git diff --stat -- readings china news datapackage.json >&2
            echo "managed publication graph changed during replay" >&2
            exit 1
          fi

      - name: Read the public surface
        # [skip pytest] is only Palimpsest's full-suite lane marker. The explicit
        # publication dispatch above is what makes action-token refreshes visible.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Verify the tamper-evident chains
        # Offline, stdlib, no secrets — the same commands the site tells a reader to run.
        run: |
          python -m scripts.verify_ledger
          python -m scripts.verify_eval_registry
          python -m scripts.verify_refusal_transcripts || rc=$?
          if [ "${rc:-0}" = "1" ]; then exit 1; fi
          unset rc
          python -m scripts.verify_gfi_transcripts || rc=$?
          if [ "${rc:-0}" = "1" ]; then exit 1; fi
          python -m scripts.build_eval_assurance --check
          python -m scripts.build_eval_journal --check
          python -m scripts.build_eval_findings --check

  publication-admission:
    name: Admit the exact tested publication
    needs:
      - pytest
      - contract
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable exact-SHA gate
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          PUBLICATION_SCOPE: ${{ needs.contract.outputs.scope }}
          PYTEST_RESULT: ${{ needs.pytest.result }}
        run: |
          set -euo pipefail
          test "$CONTRACT_RESULT" = success
          if [ "$GITHUB_EVENT_NAME" = repository_dispatch ] &&
             [ "$PUBLICATION_SCOPE" = source ]; then
            test "$PYTEST_RESULT" = skipped
          else
            case "$GITHUB_EVENT_NAME" in
              repository_dispatch|push|pull_request)
                test "$PYTEST_RESULT" = success
                ;;
              *)
                echo "unsupported publication event: $GITHUB_EVENT_NAME" >&2
                exit 1
                ;;
            esac
          fi

  china-economic-review-bundle:
    name: Build and attest exact China economic review bundle
    needs:
      - contract
      - publication-admission
    if: >-
      needs.contract.result == 'success' &&
      needs.publication-admission.result == 'success' &&
      needs.contract.outputs.scope == 'complete' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.contract.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Allocate the runner-temporary handoff directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/china-economic-review-v3"
          echo "REVIEW_DIR=$RUNNER_TEMP/china-economic-review-v3" >> "$GITHUB_ENV"

      - name: Capture and validate the exact GitHub merge identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          request="repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA?per_page=1"
          gh api \
            --method GET \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$request" > "$REVIEW_DIR/github-commit.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime
          from pathlib import Path

          path = Path(os.environ["REVIEW_DIR"]) / "github-commit.json"
          raw = path.read_bytes()
          if not 1 <= len(raw) <= 262_144:
              raise SystemExit("GitHub commit evidence exceeds its bounded byte contract")
          value = json.loads(raw)
          sha = os.environ["GITHUB_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          verification = value.get("commit", {}).get("verification")
          parents = value.get("parents")
          if (
              value.get("sha") != sha
              or value.get("url") != f"https://api.github.com/repos/{repo}/commits/{sha}"
              or value.get("author", {}).get("login") != "beepboop2025"
              or value.get("committer", {}).get("login") != "web-flow"
              or not isinstance(parents, list)
              or len(parents) < 2
              or not isinstance(verification, dict)
              or verification.get("verified") is not True
              or verification.get("reason") != "valid"
          ):
              raise SystemExit("GitHub commit evidence is not a verified merge identity")
          parent_shas = [parent.get("sha") for parent in parents]
          if (
              len(parent_shas) != len(set(parent_shas))
              or any(
                  not isinstance(parent, str)
                  or re.fullmatch(r"[0-9a-f]{40}", parent) is None
                  for parent in parent_shas
              )
          ):
              raise SystemExit("GitHub commit evidence has invalid parents")
          verified_at = verification.get("verified_at")
          if not isinstance(verified_at, str) or not verified_at.endswith("Z"):
              raise SystemExit("GitHub commit evidence lacks a verified_at clock")
          try:
              parsed = datetime.fromisoformat(verified_at[:-1] + "+00:00")
          except ValueError as exc:
              raise SystemExit("GitHub verified_at clock is invalid") from exc
          if parsed.isoformat().replace("+00:00", "Z") != verified_at:
              raise SystemExit("GitHub verified_at clock is not canonical")
          local_parents = os.popen("git show -s --format=%P HEAD").read().strip().split()
          if local_parents != parent_shas:
              raise SystemExit("GitHub and checked-out merge parents differ")
          print(
              "github-commit "
              f"bytes={len(raw)} sha256={hashlib.sha256(raw).hexdigest()} "
              f"parents={len(parent_shas)} verified_at={verified_at}"
          )
          PY

      - name: Prove the producer is the current release-reviewed main merge
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "${{ needs.contract.outputs.revision }}"
          test "$(git rev-list --parents -n 1 HEAD | awk '{print NF}')" -ge 3
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Fetch one exact public WDI response
        run: |
          set -euo pipefail
          mkdir -p "$REVIEW_DIR"
          python - <<'PY'
          import hashlib
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          from collectors.world_bank_wdi import build_url, fetch_bytes, load_registry
          from core.china_econ_export import (
              load_market_registry,
              load_source_policy,
              require_world_bank_wdi_rights,
          )

          registry_path = Path("config/china_econ_wdi_series.json")
          policy = load_source_policy(Path("config/china_econ_source_policy.json"))
          market_registry = load_market_registry(registry_path)
          preflight_at = datetime.now(UTC)
          require_world_bank_wdi_rights(
              policy,
              market_registry,
              evaluated_at=preflight_at,
          )
          registry = load_registry(registry_path)
          end_year = preflight_at.year
          url = build_url(
              registry,
              start_year=1960,
              end_year=end_year,
          )
          raw = fetch_bytes(url)
          collected_at = datetime.now(UTC)
          require_world_bank_wdi_rights(
              policy,
              market_registry,
              evaluated_at=collected_at,
          )
          destination = Path(os.environ["REVIEW_DIR"]) / "world-bank-wdi-response.json"
          destination.write_bytes(raw)
          raw_sha256 = hashlib.sha256(raw).hexdigest()
          collected_at_text = collected_at.isoformat().replace("+00:00", "Z")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"WDI_REVIEW_END_YEAR={end_year}\n")
              handle.write(f"WDI_REVIEW_REQUEST_URL={url}\n")
              handle.write(f"WDI_REVIEW_COLLECTED_AT={collected_at_text}\n")
              handle.write(f"WDI_REVIEW_RAW_SHA256={raw_sha256}\n")
          print(
              f"wdi-response bytes={len(raw)} sha256={raw_sha256} "
              f"collected_at={collected_at_text} url={url}"
          )
          PY

      - name: Build the exact review ledger and v3 Seiche handoff
        run: |
          set -euo pipefail
          review_end_year="${WDI_REVIEW_END_YEAR:?missing sealed WDI end year}"
          test -n "${WDI_REVIEW_REQUEST_URL:?missing sealed WDI request URL}"
          test -n "${WDI_REVIEW_COLLECTED_AT:?missing post-response clock}"
          test -n "${WDI_REVIEW_RAW_SHA256:?missing raw response digest}"
          git show HEAD:readings/china-econ-wdi-observations.jsonl \
            > "$REVIEW_DIR/china-econ-wdi-observations.jsonl"
          python -m scripts.china_econ_wdi_pull \
            --registry config/china_econ_wdi_series.json \
            --input "$REVIEW_DIR/world-bank-wdi-response.json" \
            --ledger "$REVIEW_DIR/china-econ-wdi-observations.jsonl" \
            --latest "$REVIEW_DIR/china-econ-wdi-live-check.json" \
            --start-year 1960 \
            --end-year "$review_end_year" \
            --collected-at "$WDI_REVIEW_COLLECTED_AT"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from core.china_econ_export import (
              canonical_json_bytes,
              load_availability_receipt,
          )

          root = Path(os.environ["REVIEW_DIR"])
          live = json.loads(
              (root / "china-econ-wdi-live-check.json").read_text(encoding="utf-8")
          )
          tracked = json.loads(
              Path("readings/china-econ-wdi-latest.json").read_text(encoding="utf-8")
          )
          registry_path = Path("config/china_econ_wdi_series.json")
          raw_path = root / "world-bank-wdi-response.json"
          raw_sha256 = hashlib.sha256(raw_path.read_bytes()).hexdigest()
          if raw_sha256 != os.environ["WDI_REVIEW_RAW_SHA256"]:
              raise SystemExit("WDI raw response digest changed after collection")
          if live["batch_raw_sha256"] != raw_sha256:
              raise SystemExit("live WDI receipt does not bind the exact raw response")
          if live["generated_at"] != os.environ["WDI_REVIEW_COLLECTED_AT"]:
              raise SystemExit("live WDI receipt does not use the post-response clock")
          if live["response_coverage"]["requested_end_year"] != int(
              os.environ["WDI_REVIEW_END_YEAR"]
          ):
              raise SystemExit("live WDI receipt changed the sealed request end year")
          source_receipt = live["collector_artifact"]["source_receipt"]
          if (
              source_receipt["url"] != os.environ["WDI_REVIEW_REQUEST_URL"]
              or source_receipt["raw_sha256"] != raw_sha256
          ):
              raise SystemExit("live WDI source receipt changed the sealed request scope")
          load_availability_receipt(
              root / "china-econ-wdi-live-check.json",
              series_registry_path=registry_path,
          )
          load_availability_receipt(
              Path("readings/china-econ-wdi-latest.json"),
              series_registry_path=registry_path,
          )
          if live["appended_observations"] != 0:
              raise SystemExit(
                  "live WDI values differ from the Git-tracked durable ledger; "
                  "run the reviewed WDI publisher before creating a handoff"
              )
          if canonical_json_bytes(live["availability"]) != canonical_json_bytes(
              tracked["availability"]
          ):
              raise SystemExit(
                  "live WDI availability differs from the reviewed main receipt"
              )
          stable_keys = {
              "source_id",
              "dataset",
              "dataset_last_updated",
              "license",
              "license_url",
              "rights_evidence_url",
              "redistribution_status",
              "context_only",
              "scoring_allowed",
              "response_coverage",
              "ledger_coverage",
              "indicator_provenance",
              "limitations",
          }
          if {key: live[key] for key in stable_keys} != {
              key: tracked[key] for key in stable_keys
          }:
              raise SystemExit(
                  "live WDI receipt semantics differ from the reviewed main receipt"
              )
          def stable_collector(document):
              artifact = document["collector_artifact"]
              source = artifact["source_receipt"]
              freshness = artifact["freshness"]
              return {
                  "schema_version": artifact["schema_version"],
                  "collector_id": artifact["collector_id"],
                  "abstention": artifact["abstention"],
                  "coverage": artifact["coverage"],
                  "source_receipt": {
                      key: source[key]
                      for key in ("url", "dataset_last_updated", "license")
                  },
                  "freshness": {
                      key: freshness[key]
                      for key in ("evidence_state", "native_cadence")
                  },
              }
          if stable_collector(live) != stable_collector(tracked):
              raise SystemExit(
                  "live WDI collector authority differs from the reviewed main receipt"
              )
          PY
          cmp --silent readings/china-econ-wdi-observations.jsonl \
            "$REVIEW_DIR/china-econ-wdi-observations.jsonl"
          git show HEAD:readings/china-econ-wdi-latest.json \
            > "$REVIEW_DIR/china-econ-wdi-latest.json"
          cmp --silent readings/china-econ-wdi-latest.json \
            "$REVIEW_DIR/china-econ-wdi-latest.json"
          python -m scripts.build_china_econ_export \
            --ledger "$REVIEW_DIR/china-econ-wdi-observations.jsonl" \
            --availability-receipt "$REVIEW_DIR/china-econ-wdi-latest.json" \
            --policy config/china_econ_source_policy.json \
            --series-registry config/china_econ_wdi_series.json \
            --output "$REVIEW_DIR/palimpsest-china-economic-export-v1.jsonl" \
            --manifest "$REVIEW_DIR/palimpsest-china-economic-export-v3-manifest.json" \
            --producer-repository "$GITHUB_REPOSITORY" \
            --producer-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-run-event "$GITHUB_EVENT_NAME"
          git show HEAD:config/china_econ_source_policy.json \
            > "$REVIEW_DIR/china_econ_source_policy.json"
          git show HEAD:config/china_econ_wdi_series.json \
            > "$REVIEW_DIR/china_econ_wdi_series.json"

      - name: Seal exact inputs, outputs, and review receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m scripts.build_china_econ_lineage \
            --revision HEAD \
            --current-commit-evidence "$REVIEW_DIR/github-commit.json" \
            --output-chain "$REVIEW_DIR/china-econ-wdi-lineage-chain.jsonl" \
            --output-evidence "$REVIEW_DIR/github-commit-lineage-evidence.jsonl" \
            --output-receipt "$RUNNER_TEMP/china-econ-wdi-lineage-receipt.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from core.china_econ_export import (
              canonical_json_bytes,
              parse_github_commit_evidence,
          )

          root = Path(os.environ["REVIEW_DIR"])
          manifest_path = root / "palimpsest-china-economic-export-v3-manifest.json"
          latest_path = root / "china-econ-wdi-latest.json"
          live_path = root / "china-econ-wdi-live-check.json"
          commit_path = root / "github-commit.json"
          lineage_receipt_path = (
              Path(os.environ["RUNNER_TEMP"])
              / "china-econ-wdi-lineage-receipt.json"
          )
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          latest = json.loads(latest_path.read_text(encoding="utf-8"))
          live = json.loads(live_path.read_text(encoding="utf-8"))
          commit_raw = commit_path.read_bytes()
          if not 1 <= len(commit_raw) <= 262_144:
              raise SystemExit("GitHub commit evidence exceeds its bounded byte contract")
          if live["appended_observations"] != 0:
              raise SystemExit(
                  "live WDI values differ from the Git-tracked durable ledger; "
                  "run the reviewed WDI publisher before creating a handoff"
              )
          expected_core_names = {
              "china-econ-wdi-latest.json",
              "china-econ-wdi-live-check.json",
              "china-econ-wdi-lineage-chain.jsonl",
              "china-econ-wdi-observations.jsonl",
              "china_econ_source_policy.json",
              "china_econ_wdi_series.json",
              "github-commit.json",
              "github-commit-lineage-evidence.jsonl",
              "palimpsest-china-economic-export-v1.jsonl",
              "palimpsest-china-economic-export-v3-manifest.json",
              "world-bank-wdi-response.json",
          }
          core_names = sorted(
              path.name
              for path in root.iterdir()
              if path.is_file() and path.name not in {"SHA256SUMS", "handoff-receipt.json"}
          )
          if set(core_names) != expected_core_names:
              raise SystemExit(
                  f"unexpected handoff inputs: {sorted(set(core_names) ^ expected_core_names)}"
              )

          def exact_receipt(path, *, expected_sha, expected_bytes=None):
              payload = path.read_bytes()
              if hashlib.sha256(payload).hexdigest() != expected_sha:
                  raise SystemExit(f"digest mismatch for {path.name}")
              if expected_bytes is not None and len(payload) != expected_bytes:
                  raise SystemExit(f"byte-count mismatch for {path.name}")
              return payload

          if manifest["producer"]["repository"] != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("producer repository does not match the workflow")
          if manifest["producer"]["commit_sha"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("producer commit does not match the workflow")
          producer_sha = manifest["producer"]["commit_sha"]
          commit_identity = parse_github_commit_evidence(
              commit_raw,
              expected_sha=producer_sha,
          )
          lineage_receipt_raw = lineage_receipt_path.read_bytes()
          lineage_receipt = json.loads(lineage_receipt_raw)
          if canonical_json_bytes(lineage_receipt) != lineage_receipt_raw:
              raise SystemExit("lineage receipt is not canonical JSON")
          if lineage_receipt["evaluated_at_commit_sha"] != producer_sha:
              raise SystemExit("lineage was not evaluated at the producer commit")
          workflow_run = manifest["producer"]["workflow_run"]
          if workflow_run != {
              "provider": "github_actions",
              "workflow_file": ".github/workflows/tests.yml",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "head_sha": os.environ["GITHUB_SHA"],
              "event": "push",
              "conclusion": "success",
              "url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
          }:
              raise SystemExit("producer workflow receipt does not match the workflow")

          policy = exact_receipt(
              root / manifest["policy"]["path"],
              expected_sha=manifest["policy"]["sha256"],
          )
          registry = exact_receipt(
              root / manifest["series_registry"]["path"],
              expected_sha=manifest["series_registry"]["sha256"],
              expected_bytes=manifest["series_registry"]["bytes"],
          )
          artifact = exact_receipt(
              root / manifest["artifact"]["path"],
              expected_sha=manifest["artifact"]["sha256"],
              expected_bytes=manifest["artifact"]["bytes"],
          )
          if len(artifact.splitlines()) != manifest["artifact"]["records"]:
              raise SystemExit("artifact record count does not match the manifest")
          availability_bytes = exact_receipt(
              root / manifest["availability_receipt"]["path"],
              expected_sha=manifest["availability_receipt"]["sha256"],
              expected_bytes=manifest["availability_receipt"]["bytes"],
          )
          chain_bytes = exact_receipt(
              root / lineage_receipt["path"],
              expected_sha=lineage_receipt["sha256"],
              expected_bytes=lineage_receipt["bytes"],
          )
          evidence_receipt = lineage_receipt["evidence"]
          evidence_bytes = exact_receipt(
              root / evidence_receipt["path"],
              expected_sha=evidence_receipt["sha256"],
              expected_bytes=evidence_receipt["bytes"],
          )
          chain_rows = [json.loads(line) for line in chain_bytes.splitlines()]
          evidence_rows = [json.loads(line) for line in evidence_bytes.splitlines()]
          if (
              len(chain_rows) != lineage_receipt["records"]
              or len(evidence_rows) != evidence_receipt["records"]
              or len(chain_rows) != len(evidence_rows)
              or chain_rows[0]["commit"]["sha"]
              != lineage_receipt["root_commit_sha"]
              or chain_rows[-1]["commit"]["sha"]
              != lineage_receipt["tip_commit_sha"]
          ):
              raise SystemExit("governed lineage chain receipt does not reconcile")
          if not policy or not registry:
              raise SystemExit("reviewed policy and registry must be non-empty")
          files = []
          for name in core_names:
              payload = (root / name).read_bytes()
              files.append(
                  {
                      "path": name,
                      "sha256": hashlib.sha256(payload).hexdigest(),
                      "bytes": len(payload),
                  }
              )
          receipt = {
              "schema_version": "palimpsest.china-economic-handoff-receipt.v3",
              "producer": manifest["producer"],
              "producer_commit_evidence": {
                  "path": "github-commit.json",
                  **commit_identity,
                  "sha256": hashlib.sha256(commit_raw).hexdigest(),
                  "bytes": len(commit_raw),
              },
              "revision_lineage": {
                  "mode": "git_tracked_reviewed_merge_chain",
                  "chain": lineage_receipt,
                  "cross_run_revision_authority": True,
                  "live_check_new_vintages_appended": live[
                      "appended_observations"
                  ],
              },
              "artifact": manifest["artifact"],
              "input_ledger": manifest["input_ledger"],
              "reviewed_availability_receipt": manifest["availability_receipt"],
              "live_verification": {
                  "path": "china-econ-wdi-live-check.json",
                  "sha256": hashlib.sha256(live_path.read_bytes()).hexdigest(),
                  "bytes": len(live_path.read_bytes()),
                  "batch_raw_sha256": live["batch_raw_sha256"],
                  "current_availability_sha256": hashlib.sha256(
                      canonical_json_bytes(live["availability"])
                  ).hexdigest(),
              },
              "live_raw_response": {
                  "path": "world-bank-wdi-response.json",
                  "sha256": live["batch_raw_sha256"],
              },
              "files": files,
          }
          (root / "handoff-receipt.json").write_bytes(canonical_json_bytes(receipt))

          checksum_names = sorted(path.name for path in root.iterdir() if path.is_file())
          checksums = "".join(
              f"{hashlib.sha256((root / name).read_bytes()).hexdigest()} *{name}\n"
              for name in checksum_names
              if name != "SHA256SUMS"
          )
          (root / "SHA256SUMS").write_text(checksums, encoding="ascii")

          raw = (root / "world-bank-wdi-response.json").read_bytes()
          if hashlib.sha256(raw).hexdigest() != live["batch_raw_sha256"]:
              raise SystemExit("raw response digest does not match the live WDI receipt")
          ledger = (root / manifest["input_ledger"]["path"]).read_bytes()
          if (
              hashlib.sha256(ledger).hexdigest() != manifest["input_ledger"]["sha256"]
              or len(ledger) != manifest["input_ledger"]["bytes"]
          ):
              raise SystemExit("input ledger does not match the export manifest")
          expected_ledger = {
              key: manifest["input_ledger"][key]
              for key in ("sha256", "bytes", "records")
          }
          tip = chain_rows[-1]
          if tip["ledger"] != {
              "path": "readings/china-econ-wdi-observations.jsonl",
              **expected_ledger,
          }:
              raise SystemExit("lineage tip is not the exact export ledger")
          if {
              key: tip["availability_receipt"][key]
              for key in ("sha256", "bytes", "schema_version", "generated_at")
          } != {
              key: manifest["availability_receipt"][key]
              for key in ("sha256", "bytes", "schema_version", "generated_at")
          }:
              raise SystemExit("lineage tip is not the reviewed availability receipt")
          if {
              key: tip["registry_transition"]["current"][key]
              for key in ("sha256", "bytes", "schema_version")
          } != {
              key: manifest["series_registry"][key]
              for key in ("sha256", "bytes", "schema_version")
          }:
              raise SystemExit("lineage tip is not the reviewed series registry")
          if latest["ledger_after"] != expected_ledger:
              raise SystemExit("reviewed availability is not bound to the export ledger")
          if live["ledger_before"] != expected_ledger or live["ledger_after"] != expected_ledger:
              raise SystemExit("live check advanced beyond the reviewed export ledger")
          if canonical_json_bytes(live["availability"]) != canonical_json_bytes(
              latest["availability"]
          ):
              raise SystemExit("live and reviewed current availability differ")
          if hashlib.sha256(availability_bytes).hexdigest() != manifest[
              "availability_receipt"
          ]["sha256"]:
              raise SystemExit("reviewed availability receipt digest changed")
          print(checksums, end="")
          PY
          {
            echo '### China economic review bundle'
            echo
            echo '```text'
            cat "$REVIEW_DIR/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Attest the checksum root
        id: attest_china_economic_bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/china-economic-review-v3/SHA256SUMS

      - name: Retain the signed attestation bundle with the handoff
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest_china_economic_bundle.outputs.bundle-path }}
          ATTESTATION_URL: ${{ steps.attest_china_economic_bundle.outputs.attestation-url }}
        run: |
          set -euo pipefail
          test -f "$ATTESTATION_BUNDLE"
          cp "$ATTESTATION_BUNDLE" "$REVIEW_DIR/github-attestation.jsonl"
          printf '\nAttestation: %s\n' "$ATTESTATION_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the non-Pages review handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: china-economic-review-v3-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/china-economic-review-v3/
          if-no-files-found: error
          retention-days: 90

  mcp-deployment-admission:
    name: Admit exact deployed MCP release before Pages
    needs:
      - contract
      - publication-admission
    if: >-
      needs.contract.result == 'success' &&
      needs.publication-admission.result == 'success' &&
      needs.contract.outputs.scope == 'complete' &&
      github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.contract.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind Pages to the catalog-declared deployed MCP release
        id: mcp_release
        env:
          PUBLICATION_SHA: ${{ needs.contract.outputs.revision }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = repository_dispatch
          test "$(git rev-parse HEAD)" = "$PUBLICATION_SHA"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$PUBLICATION_SHA"

          deployment_sha=$(jq -er '
            [.entries[]
             | select(.identifier ==
                 "urn:air:palimpsest.info:mcp:evidence-observatory")
             | .metadata.deploymentCommit]
            | select(length == 1)
            | .[0]
            | select(type == "string" and test("^[0-9a-f]{40}$"))
          ' .well-known/ai-catalog.json)
          deployment_receipt_url=$(jq -er '
            [.entries[]
             | select(.identifier ==
                 "urn:air:palimpsest.info:mcp:evidence-observatory")
             | .metadata.deploymentReceipt]
            | select(length == 1)
            | .[0]
            | select(type == "string")
          ' .well-known/ai-catalog.json)
          deployment_receipt_digest=$(jq -er '
            [.entries[]
             | select(.identifier ==
                 "urn:air:palimpsest.info:mcp:evidence-observatory")
             | .metadata.deploymentReceiptSha256]
            | select(length == 1)
            | .[0]
            | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))
          ' .well-known/ai-catalog.json)
          deployment_run_url=$(jq -er '
            [.entries[]
             | select(.identifier ==
                 "urn:air:palimpsest.info:mcp:evidence-observatory")
             | .metadata.deploymentRun]
            | select(length == 1)
            | .[0]
            | select(type == "string")
          ' .well-known/ai-catalog.json)

          server_version=$(jq -er '
            .version
            | select(type == "string" and test("^[0-9]+[.][0-9]+[.][0-9]+$"))
          ' server.json)
          deployment_receipt_path=".well-known/receipts/mcp-deployment-${server_version}.json"
          test "$deployment_receipt_url" = \
            "https://palimpsest.info/$deployment_receipt_path"
          test -f "$deployment_receipt_path"
          test ! -L "$deployment_receipt_path"
          test "sha256:$(sha256sum "$deployment_receipt_path" | awk '{print $1}')" \
            = "$deployment_receipt_digest"
          receipt_deployment_sha=$(jq -er '
            .target_sha
            | select(type == "string" and test("^[0-9a-f]{40}$"))
          ' "$deployment_receipt_path")
          deploy_run_id=$(jq -er '
            .workflow_run_id
            | select(type == "number" and . >= 1 and floor == .)
          ' "$deployment_receipt_path")
          test "$receipt_deployment_sha" = "$deployment_sha"
          test "$deployment_run_url" = \
            "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${deploy_run_id}"
          git merge-base --is-ancestor "$deployment_sha" "$PUBLICATION_SHA"

          # Pages may carry a reviewed data-only publication beyond the deployed
          # MCP commit, but it may not carry changed runtime or manifest bytes.
          # Exact Git blob identity makes this a fail-closed release boundary.
          for contract_path in mcp/palimpsest_mcp.py server.json; do
            deployed_object=$(git rev-parse "$deployment_sha:$contract_path")
            publication_object=$(git rev-parse "$PUBLICATION_SHA:$contract_path")
            test "$(git cat-file -t "$deployed_object")" = blob
            test "$(git cat-file -t "$publication_object")" = blob
            test "$deployed_object" = "$publication_object"
          done

          # Execute the verifier and smoke contract from the receipt-bound commit,
          # rather than allowing a later data publication to weaken either probe.
          contract_dir="$RUNNER_TEMP/deployed-mcp-contract"
          test ! -e "$contract_dir"
          install -d -m 0700 "$contract_dir"
          git show "$deployment_sha:ops/mcp-deploy/verify_registry_release.py" \
            > "$contract_dir/verify_registry_release.py"
          git show "$deployment_sha:scripts/smoke_palimpsest_mcp.py" \
            > "$contract_dir/smoke_palimpsest_mcp.py"
          git show "$deployment_sha:mcp/palimpsest_mcp.py" \
            > "$contract_dir/palimpsest_mcp.py"
          git show "$deployment_sha:server.json" > "$contract_dir/server.json"
          chmod 0500 \
            "$contract_dir/verify_registry_release.py" \
            "$contract_dir/smoke_palimpsest_mcp.py"
          chmod 0400 \
            "$contract_dir/palimpsest_mcp.py" \
            "$contract_dir/server.json"
          {
            echo "deployment_sha=$deployment_sha"
            echo "deployment_run_id=$deploy_run_id"
            echo "deployment_receipt_path=$deployment_receipt_path"
          } >> "$GITHUB_OUTPUT"

      - name: Prove the exact successful MCP deployment receipt
        env:
          DEPLOYMENT_RECEIPT_PATH: ${{ steps.mcp_release.outputs.deployment_receipt_path }}
          DEPLOY_RUN_ID: ${{ steps.mcp_release.outputs.deployment_run_id }}
          DEPLOYMENT_SHA: ${{ steps.mcp_release.outputs.deployment_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deploy_run_id=$DEPLOY_RUN_ID
          case "$deploy_run_id" in
            ''|*[!0-9]*) echo "catalog deploy run ID is invalid" >&2; exit 1 ;;
          esac

          runs_json="$RUNNER_TEMP/mcp-deploy-runs.json"
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-mcp.yml/runs" \
            -f event=workflow_dispatch \
            -f status=success \
            -f head_sha="$DEPLOYMENT_SHA" \
            -F per_page=100 > "$runs_json"
          jq -er \
            --arg sha "$DEPLOYMENT_SHA" \
            --argjson run_id "$deploy_run_id" '
            [.workflow_runs[]
             | select(.id == $run_id)
             | select(.head_sha == $sha)
             | select(.head_branch == "main")
             | select(.event == "workflow_dispatch")
             | select(.status == "completed" and .conclusion == "success")
             | select((.path | split("@")[0]) == ".github/workflows/deploy-mcp.yml")]
            | select(length == 1)
            | .[0].id == $run_id
          ' "$runs_json" >/dev/null
          run_json="$RUNNER_TEMP/mcp-deploy-run.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$deploy_run_id" \
            > "$run_json"
          run_attempt=$(jq -er '
            .run_attempt | select(type == "number" and . >= 1)
          ' "$run_json")
          test "$run_attempt" -ge 1
          python3 "$RUNNER_TEMP/deployed-mcp-contract/verify_registry_release.py" \
            deployment \
            --receipt "$DEPLOYMENT_RECEIPT_PATH" \
            --run-json "$run_json" \
            --manifest "$RUNNER_TEMP/deployed-mcp-contract/server.json" \
            --target-sha "$DEPLOYMENT_SHA" \
            --deploy-run-id "$deploy_run_id" \
            --repository "$GITHUB_REPOSITORY"

      - name: Re-probe the deployed public MCP release
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/deployed-mcp-contract/smoke_palimpsest_mcp.py" \
            --url https://api.seiche.info/palimpsest/mcp \
            --module "$RUNNER_TEMP/deployed-mcp-contract/palimpsest_mcp.py" \
            --manifest "$RUNNER_TEMP/deployed-mcp-contract/server.json" \
            --timeout 20

  pages-artifact:
    name: Package exact complete Pages edition
    needs:
      - contract
      - mcp-deployment-admission
      - publication-admission
    if: >-
      needs.contract.result == 'success' &&
      needs.mcp-deployment-admission.result == 'success' &&
      needs.publication-admission.result == 'success' &&
      needs.contract.outputs.scope == 'complete' &&
      github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.contract.outputs.revision }}

      - name: Configure the existing Pages site without enabling it
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
        with:
          enablement: false

      - name: Materialize only exact tracked root content
        env:
          PUBLICATION_SHA: ${{ needs.contract.outputs.revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PUBLICATION_SHA"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$PUBLICATION_SHA"
          if git ls-files -s | awk '$1 == "120000" { found=1 } END { exit found ? 0 : 1 }'; then
            echo "Pages artifact refuses tracked symbolic links" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pages-root"
          git archive --format=tar "$PUBLICATION_SHA" |
            tar -xf - -C "$RUNNER_TEMP/pages-root"
          # upload-pages-artifact deliberately excludes dot paths. Preserve the
          # public RFC 9116 endpoint through a single reviewed archive-name
          # transform while all other hidden operational files stay excluded.
          test ! -e "$RUNNER_TEMP/pages-root/well-known"
          mv "$RUNNER_TEMP/pages-root/.well-known" \
            "$RUNNER_TEMP/pages-root/well-known"
          test ! -e "$RUNNER_TEMP/pages-root/.git"
          test ! -e "$RUNNER_TEMP/pages-root/.pytest_cache"
          test ! -e "$RUNNER_TEMP/pages-root/.ruff_cache"

      - name: Upload the exact Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4
        env:
          TAR_OPTIONS: '--transform=s|^\./well-known|./.well-known|'
        with:
          path: ${{ runner.temp }}/pages-root

      - name: Measure the exact staged Pages artifact
        id: pages_size
        env:
          PUBLICATION_SHA: ${{ needs.contract.outputs.revision }}
          # Release bridge: 1000 MiB admits the measured append-only history while
          # retaining a hard 24 MiB reserve below the pinned deploy action's
          # 1 GiB warning threshold.
          # Keep the high-growth Newswire publisher disabled until history moves
          # behind a path-preserving same-origin archive.
          PAGES_ARTIFACT_LIMIT_BYTES: "1048576000"
        run: |
          set -euo pipefail
          # The pinned upload action creates and uploads this exact tar path.
          # Measuring it avoids substituting workspace size or compressed size.
          artifact="$RUNNER_TEMP/artifact.tar"
          receipt="$RUNNER_TEMP/pages-artifact-size.json"
          test -f "$artifact"
          artifact_bytes=$(wc -c < "$artifact" | tr -d '[:space:]')
          artifact_sha256=$(sha256sum "$artifact" | awk '{print $1}')
          case "$artifact_bytes" in
            ''|*[!0-9]*) echo "invalid Pages artifact byte count" >&2; exit 1 ;;
          esac
          if [ "$artifact_bytes" -le 0 ]; then
            echo "Pages artifact is empty" >&2
            exit 1
          fi
          if [ "${#artifact_sha256}" -ne 64 ] ||
             [ -n "${artifact_sha256//[0-9a-f]/}" ]; then
            echo "invalid Pages artifact SHA-256" >&2
            exit 1
          fi
          headroom_bytes=$((PAGES_ARTIFACT_LIMIT_BYTES - artifact_bytes))
          if [ "$artifact_bytes" -le "$PAGES_ARTIFACT_LIMIT_BYTES" ]; then
            within_limit=true
            status=within-limit
          else
            within_limit=false
            status=over-limit
          fi
          printf '%s\n' \
            "{\"artifact_bytes\":$artifact_bytes,\"artifact_name\":\"github-pages/artifact.tar\",\"artifact_sha256\":\"$artifact_sha256\",\"headroom_bytes\":$headroom_bytes,\"limit_bytes\":$PAGES_ARTIFACT_LIMIT_BYTES,\"publication_sha\":\"$PUBLICATION_SHA\",\"schema_version\":\"palimpsest.pages-artifact-size.v1\",\"status\":\"$status\"}" \
            > "$receipt"
          {
            echo "artifact_bytes=$artifact_bytes"
            echo "headroom_bytes=$headroom_bytes"
            echo "within_limit=$within_limit"
          } >> "$GITHUB_OUTPUT"
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Pages artifact size receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pages-artifact-size-${{ needs.contract.outputs.revision }}
          path: ${{ runner.temp }}/pages-artifact-size.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce the Pages artifact size ceiling
        if: ${{ steps.pages_size.outputs.within_limit != 'true' }}
        env:
          ARTIFACT_BYTES: ${{ steps.pages_size.outputs.artifact_bytes }}
          HEADROOM_BYTES: ${{ steps.pages_size.outputs.headroom_bytes }}
        run: |
          echo "Pages artifact is too large: ${ARTIFACT_BYTES} bytes (${HEADROOM_BYTES} bytes headroom)" >&2
          exit 1

  deploy-pages:
    name: Deploy exact complete Pages edition
    needs:
      - contract
      - mcp-deployment-admission
      - publication-admission
      - pages-artifact
    if: >-
      needs.contract.result == 'success' &&
      needs.mcp-deployment-admission.result == 'success' &&
      needs.publication-admission.result == 'success' &&
      needs.contract.outputs.scope == 'complete' &&
      github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-production
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.contract.outputs.revision }}

      - name: Refuse a superseded Pages deployment
        env:
          PUBLICATION_SHA: ${{ needs.contract.outputs.revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PUBLICATION_SHA"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$PUBLICATION_SHA"

      - name: Deploy the exact accepted edition
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
