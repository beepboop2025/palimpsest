[Service]
# C0 only: keep legacy consumers on their unchanged authority paths while the
# protected authority is introduced. C1 removes this reviewed drop-in before
# installing consumers.
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/libexec/palimpsest-public-osint-sync/current/public_osint_sync.py --legacy-readings-mirror
ReadOnlyPaths=
ReadOnlyPaths=/usr/local/libexec/palimpsest-public-osint-sync /etc/palimpsest/deployed-commit
ReadWritePaths=/var/lib/palimpsest-public-osint-sync /var/lib/palimpsest/readings

# The legacy readings directory remains producer-owned during C0. Reset the
# base capability set so the atomic sibling-file replacement can cross that
# directory's DAC boundary while ProtectSystem keeps every other path sealed.
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH CAP_FOWNER
