name: Refresh net4people firewall-event signal

# The community log of China network-blocking events and circumvention moves
# (github.com/net4people/bbs), read via the GitHub Issues API. Qualitative
# companion to the OONI anomaly signal. Vantage-insensitive (ingests a public
# overseas repo), stdlib-only. Uses GITHUB_TOKEN for the higher API rate limit.

on:
  schedule:
    - cron: "41 */12 * * *"     # twice daily, offset from the other signals
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: net4people-refresh
  cancel-in-progress: false

jobs:
  net4people:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Pull net4people/bbs events and publish the signal
        run: python -m scripts.net4people_pull

      - name: Read the public surface before pushing it
        # This repository is served in full by Pages, so the push below is the publication
        # act and this is the last point at which a match can still be stopped. The test
        # workflow cannot cover this commit: it carries [skip ci], and GitHub skips the
        # whole run rather than one job. Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit & push if the events changed
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git add readings/net4people-latest.json readings/net4people-history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: net4people firewall-event refresh ($(date -u +%FT%TZ)) [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
