name: Refresh Wayback reconstruction

# Recover deletion and silent-redaction events — with real, archive-witnessed timestamps — for a
# watchlist of public Chinese URLs, by walking each URL's Internet Archive CDX capture timeline
# (collectors/wayback_vantage.py). The Archive is an outside-the-wall, retroactive in-country
# observer, so this closes the velocity gap the social-web legs cannot reach — from open egress.
# Stdlib-only, key-less, read-only against archive.org (never Chinese infrastructure, never a
# person). Fail-soft: if CDX is unreachable for every URL the runner abstains, publishing nothing.

on:
  schedule:
    - cron: "23 */12 * * *"     # every 12 hours, offset from the other signals
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wayback-refresh
  cancel-in-progress: false

jobs:
  wayback:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Reconstruct deletions from the Wayback CDX timeline
        run: python -m scripts.wayback_reconstruct_pull

      - name: Read the public surface before pushing it
        # This repository is served in full by Pages, so the push below is the publication
        # act and this is the last point at which a match can still be stopped. The test
        # workflow marks the commit [skip pytest] so Tests/pytest skips; Tests/contract still runs. GitHub does not skip the
        # whole run rather than one job. Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit & push if the reconstruction changed
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git add readings/wayback-latest.json readings/wayback-history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: Wayback reconstruction refresh ($(date -u +%FT%TZ)) [skip pytest]"
            python scripts/push_data_commit.py
          fi
