name: Tests

# The test suite, run as a gate rather than as advice. Until this existed, every
# guard test in the repo — including tests/test_no_dangerous_sinks.py, which is the
# thing standing between a future edit and a code-execution sink on a collection
# path — could only fail on someone's laptop. A guard that cannot fail the build is
# documentation, not a guard.
#
# Two suites, one command:
#   tests/            — the observatory's own suite (stdlib-only by design, so it
#                       also runs on a bare interpreter with no install step).
#   censorwatch/tests — the velocity leg's suite, which DOES need the installed
#                       dependencies (pandas et al.); it is only meaningful after
#                       `pip install -r requirements.txt`, which is why this
#                       workflow installs before running rather than relying on the
#                       stdlib-only invocation the README documents for local use.
#
# No secrets, no network reads: nothing here collects data. The suites are offline.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # The data-refresh workflows push bot commits marked [skip ci]; those touch only
    # published readings and never the code under test, so re-running the FULL suite on
    # them would burn minutes to re-prove the previous commit. GitHub honours the
    # marker natively for pushes — this makes the intent explicit and readable, and
    # is a no-op for pull_request events (head_commit is absent there, so the guard
    # evaluates false and the job runs).
    #
    # "never the code under test" was true when this was written and is not true now.
    # Several tests exist specifically to validate PUBLISHED READINGS — the publication
    # contract, layer freshness, board staleness — so a refresh could publish a reading
    # with a missing timestamp, an unregistered signal or a zero denominator and no CI
    # run would ever look at it. Those tests are the `contract` job below, which
    # deliberately does NOT skip data commits. The split keeps the fast path fast: the
    # full suite still skips them, the reading validators never do.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + test dependencies
        # censorwatch/tests need these; tests/ deliberately does not.
        run: pip install --quiet -r requirements.txt

      - name: Run the full suite
        run: python -m pytest tests/ censorwatch/tests/ -q

  contract:
    # THE READING VALIDATORS. This job has NO [skip ci] guard, on purpose: it is the only
    # thing that ever inspects what a refresh actually published. Every one of these tests
    # is stdlib-only and offline, so it costs seconds rather than the full suite's minutes,
    # which is what makes running it on every data commit affordable.
    #
    # It also runs the three integrity verifiers. Those live inside erasure-refresh today,
    # so a change that breaks the ledger verifier is caught only if it happens to touch that
    # workflow — the one guarantee the project asks readers to check for themselves should
    # not depend on which cron fired.
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install pytest only
        # NOT -r requirements.txt. These tests are stdlib-only by design — verified against a
        # venv containing nothing but pytest — so the full install would cost more than the
        # tests do and would couple this job to dependencies it does not use.
        run: pip install --quiet pytest

      - name: Validate what is actually published
        run: |
          python -m pytest -q \
            tests/test_publication_contract.py \
            tests/test_erasure_layer_freshness.py \
            tests/test_board_stale_is_not_calm.py \
            tests/test_cadence_matches_crons.py \
            tests/test_method_version_guard.py

      - name: Verify the tamper-evident chains
        # Offline, stdlib, no secrets — the same commands the site tells a reader to run.
        run: |
          python -m scripts.verify_ledger
          python -m scripts.verify_eval_registry
