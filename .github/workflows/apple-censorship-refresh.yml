name: Refresh Apple Censorship census

# GreatFire's whole App Store corpus (~108k apps) for the Chinese storefront,
# and the CATEGORY COMPOSITION of what is removed — VPN, Tibet, Uyghur, LGBTQ+,
# News Media. The composition is the finding: a raw unavailability percentage
# says how much is gone, the tags say what the removals were for.
#
# Complements app-storefront-refresh rather than duplicating it. That one is our
# own live panel and catches an individual delisting the day it happens; this is
# scale and composition, and does not feed that signal's rate.
#
# Daily rather than 6-hourly: GreatFire's corpus scan does not move hourly, and
# polling it faster would be noise plus load on a volunteer project.
#
# Vantage-insensitive, keyless, stdlib-only.

on:
  schedule:
    - cron: "37 5 * * *"       # once a day
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apple-censorship-refresh
  cancel-in-progress: false

jobs:
  apple-censorship:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Pull the AppleCensorship corpus and publish the census
        run: python -m scripts.apple_censorship_pull

      - name: Read the public surface before pushing it
        # The push below advances auditable Git state; Pages deploys only an exact
        # SHA after its complete-graph contract passes, so this is the pre-push
        # boundary and this is the last point at which a match can still be stopped. The test
        # publisher marks [skip pytest] to identify the contract-only lane, then dispatches
        # the exact accepted SHA because action-token pushes emit no ordinary push event.
        # Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit & push if the census changed
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git add readings/apple-censorship-latest.json readings/apple-censorship-history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: Apple Censorship census refresh ($(date -u +%FT%TZ)) [skip pytest]"
            PALIMPSEST_ACTIONS_TOKEN="${{ github.token }}" python scripts/push_data_commit.py
          fi
