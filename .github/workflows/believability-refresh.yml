name: Refresh believability read

# The Li Keqiang composite (40% loan growth, 40% electricity, 20% rail
# freight) against the state's own headline IP YoY, published as drift
# against the gap's own history with a MAD band. Monthly, on the 18th —
# after the NBS 15th-17th release window, the PBC financial statistics
# report and the NRA mid-month rail news. Method note with origin,
# critiques and counterpoint: docs/BELIEVABILITY.md. Stdlib-only, keyless.

on:
  schedule:
    - cron: "43 6 18 * *"      # monthly, minute offset from the other signals
  workflow_dispatch:
    inputs:
      period:
        description: "Optional completed data month to backfill (YYYY-MM)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: believability-refresh
  cancel-in-progress: false

jobs:
  believability:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      BELIEVABILITY_PERIOD: ${{ github.event.inputs.period || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Collect the telemetry and publish the believability reading
        run: python -m scripts.believability_pull

      - name: Read the public surface before pushing it
        # The push below advances auditable Git state; Pages deploys only an exact
        # SHA after its complete-graph contract passes, so this is the pre-push
        # boundary and this is the last point at which a match can still be stopped. The test
        # publisher marks [skip pytest] to identify the contract-only lane, then dispatches
        # the exact accepted SHA because action-token pushes emit no ordinary push event.
        # Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit & push if the signal changed
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git add readings/believability-latest.json readings/believability-history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: believability refresh ($(date -u +%FT%TZ)) [skip pytest]"
            PALIMPSEST_ACTIONS_TOKEN="${{ github.token }}" python scripts/push_data_commit.py
          fi
