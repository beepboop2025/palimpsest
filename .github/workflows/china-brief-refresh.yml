name: Refresh China brief

# Rebuild /china-brief.html — the compact live state read of what the censor is working on
# right now — from the public China Digital Times feed. Stdlib-only, key-less and
# vantage-insensitive: CDT publishes from outside the wall, so this runs correctly anywhere.
#
# The page is PUBLISHED, so scripts/build_china_brief.py refuses to fall back to the demo's
# seeded sample when the feeds are unreachable. It exits non-zero instead, leaving the
# previous page in place and turning this workflow red — a visible gap rather than a
# synthetic reading wearing a live timestamp.
#
# demo/data/cdt_history.json is committed alongside the page on purpose: novelty is scored
# against that history, and without it every term reads as new on every run.

on:
  schedule:
    - cron: "13 */6 * * *"     # every 6 hours, offset from the other signals
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: china-brief-refresh
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Build the brief from the live CDT feed
        run: python -m scripts.build_china_brief

      - name: Read the public surface before pushing it
        # This repository is served in full by Pages, so the push below is the publication
        # act and this is the last point at which a match can still be stopped. The test
        # publisher marks [skip pytest] to identify the contract-only lane, then dispatches
        # the exact accepted SHA because action-token pushes emit no ordinary push event.
        # Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit & push if the reading changed
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git add china-brief.html readings/china-brief.json demo/data/cdt_history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: China brief refresh ($(date -u +%FT%TZ)) [skip pytest]"
            PALIMPSEST_ACTIONS_TOKEN="${{ github.token }}" python scripts/push_data_commit.py
          fi
