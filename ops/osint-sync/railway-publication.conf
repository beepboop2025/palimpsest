# Install only after the separate immutable adapter bundle and source marker
# pass the signed no-enable deployment procedure in RAILWAY-PUBLICATION.md.
[Service]
WorkingDirectory=/usr/local/libexec/palimpsest-railway-osint/current
RuntimeDirectory=palimpsest-osint-publication
RuntimeDirectoryMode=0700
TimeoutStartSec=15m
MemoryMax=768M
ExecStartPre=
ExecStartPre=/usr/bin/test -x /usr/bin/git
ExecStartPre=/usr/bin/test -x /usr/bin/python3
ExecStartPre=/usr/bin/test -f /etc/palimpsest/deployed-commit
ExecStartPre=/bin/sh /usr/local/libexec/palimpsest-railway-osint/current/verify-host-bundle.sh
ExecStartPre=/usr/bin/cmp -s /usr/local/libexec/palimpsest-railway-osint/current/REVISION /etc/palimpsest/osint-publication-source
ExecStart=
ExecStart=/usr/bin/python3 -B /usr/local/libexec/palimpsest-railway-osint/current/railway_osint_sync.py
ExecStartPost=/usr/bin/python3 -B /usr/local/libexec/palimpsest-railway-osint/current/railway_osint_sync.py --verify-installed
BindReadOnlyPaths=/home/palimpsest/palimpsest/.git:/run/palimpsest-osint-publication/source.git
ReadOnlyPaths=/usr/local/libexec/palimpsest-railway-osint /etc/palimpsest/osint-publication-source /var/lib/palimpsest/railway-publication
