name: Refresh App Storefront signal

# App-layer censorship: which apps are offered in the Chinese App Store
# storefront versus the US one, read from Apple's own public catalogue API.
#
# This is a different phenomenon from network blocking, and the reading says so:
# Facebook, X and YouTube stay listed in the Chinese storefront while being
# unreachable there, whereas circumvention tools and secure messengers are
# removed. Delisting is the layer that required a company to act.
#
# Vantage-insensitive, key-less, stdlib-only: Apple serves storefront metadata
# for any country to any requester, so this runs correctly from a GitHub runner
# and never touches the box's egress.

on:
  schedule:
    - cron: "53 */6 * * *"     # every 6 hours, offset from the other signals
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: app-storefront-refresh
  cancel-in-progress: false

jobs:
  app-storefront:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Compare the CN and US storefronts and publish the signal
        run: python -m scripts.app_storefront_pull

      - name: Read the public surface before pushing it
        # This repository is served in full by Pages, so the push below is the publication
        # act and this is the last point at which a match can still be stopped. The test
        # workflow marks the commit [skip pytest] so Tests/pytest skips; Tests/contract still runs. GitHub does not skip the
        # whole run rather than one job. Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit & push if the signal changed
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git add readings/app-storefront-latest.json readings/app-storefront-history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: App Storefront refresh ($(date -u +%FT%TZ)) [skip pytest]"
            python scripts/push_data_commit.py
          fi
