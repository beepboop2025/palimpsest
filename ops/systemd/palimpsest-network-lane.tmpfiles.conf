# The root is traversable but never directory-writable by either service user,
# so neither can unlink/replace the one root-owned lock inode. Mutable objects
# live in narrower shared subdirectories with inheritable named ACLs.
d /var/lib/palimpsest/network-lane           0750 root root -
f /var/lib/palimpsest/network-lane/lane.lock 0640 root root -
f /var/lib/palimpsest/network-lane/dataset.lock 0640 root root -
d /var/lib/palimpsest/network-lane/state     0750 root root -
d /var/lib/palimpsest/network-lane/receipts  0750 root root -
a /var/lib/palimpsest/network-lane           - - - - u::rwx,u:palimpsest:r-x,u:palimpsest-analysis:r-x,g::r-x,m::r-x,o::---,d:u::rwx,d:u:palimpsest:r-x,d:u:palimpsest-analysis:r-x,d:g::r-x,d:m::r-x,d:o::---
a /var/lib/palimpsest/network-lane/lane.lock - - - - u::rw-,u:palimpsest:rw-,u:palimpsest-analysis:rw-,g::r--,m::rw-,o::---
a /var/lib/palimpsest/network-lane/dataset.lock - - - - u::rw-,u:palimpsest-analysis:rw-,g::r--,m::rw-,o::---
a /var/lib/palimpsest/network-lane/state     - - - - u::rwx,u:palimpsest:rwx,u:palimpsest-analysis:rwx,g::r-x,m::rwx,o::---,d:u::rwx,d:u:palimpsest:rwx,d:u:palimpsest-analysis:rwx,d:g::r-x,d:m::rwx,d:o::---
a /var/lib/palimpsest/network-lane/receipts  - - - - u::rwx,u:palimpsest:rwx,u:palimpsest-analysis:rwx,g::r-x,m::rwx,o::---,d:u::rwx,d:u:palimpsest:rwx,d:u:palimpsest-analysis:rwx,d:g::r-x,d:m::rwx,d:o::---
