# Copy this file to:
#   /etc/systemd/system/palimpsest-backup.service.d/override.conf
# when the node uses the historical /home/palimpsest layout instead of the
# runbook's canonical /home/deploy layout.

[Unit]
Documentation=
Documentation=file:///home/palimpsest/palimpsest/ops/backup/README.md
ConditionPathIsExecutable=
ConditionPathIsExecutable=/home/palimpsest/palimpsest/ops/backup/palimpsest-backup.sh

[Service]
User=palimpsest
Group=palimpsest
WorkingDirectory=/home/palimpsest/palimpsest
ExecStart=
ExecStart=/home/palimpsest/palimpsest/ops/backup/palimpsest-backup.sh
