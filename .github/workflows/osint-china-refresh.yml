name: Refresh OSINT China roll-up

# Deterministic recomputation over the committed China-facing readings plus one optional,
# sanitized Palimpsest-Nemesis public snapshot. NEMESIS_SNAPSHOT_URL is a repository variable,
# not an API key; when configured, its HTTPS import is a fail-loud publication prerequisite.
# The hourly cadence makes freshness failures visible promptly even when no upstream payload
# changed, while concurrency prevents two publishers from racing the same atomic artefact.

on:
  schedule:
    - cron: "58 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: osint-china-refresh
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      NEMESIS_SNAPSHOT_URL: ${{ vars.NEMESIS_SNAPSHOT_URL }}
      PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Synchronize the input ledger before computation
        run: |
          git config user.name "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git fetch origin main
          git rebase origin/main

      - name: Import the optional validated Nemesis snapshot
        run: python -m scripts.import_nemesis_snapshot

      - name: Build the deterministic roll-up
        run: python -m scripts.build_osint_china

      - name: Seal the exact readings that will be published
        run: python scripts/seal_readings.py

      - name: Install the offline test runner
        run: pip install --quiet pytest

      - name: Verify the roll-up and publication contract
        run: |
          python -m pytest -q \
            tests/test_import_nemesis_snapshot.py \
            tests/test_egress_policy.py \
            tests/test_osint_china.py \
            tests/test_safe_fetch.py \
            tests/test_seal_readings.py \
            tests/test_publication_contract.py

      - name: Read the complete public surface before publication
        # The push below is the publication act. This check therefore runs after the build
        # and dedicated schema tests but before anything is staged or committed.
        run: python scripts/verify_public_surface.py

      - name: Commit, rebase, rebuild, reverify and push if inputs changed
        run: |
          git add readings/osint-china-latest.json
          if [ -e readings/nemesis-latest.json ]; then
            git add readings/nemesis-latest.json
          fi
          git add readings/readings-ledger.jsonl
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: OSINT China refresh ($(date -u +%FT%TZ)) [skip ci]"
            if ! git pull --rebase origin main; then
              # A concurrent append to the readings ledger cannot be resolved by choosing
              # either side: both proposed tails have the same predecessor. Discard only
              # this reproducible bot commit and recompute on the new public chain head.
              git rebase --abort || true
              git fetch origin main
              git switch --detach origin/main
            fi

            # The rebase can introduce newer source readings. Re-import and rebuild from that
            # merged tree, seal those exact bytes, then rerun every publication gate before
            # amending (or recreating) the bot commit.
            python -m scripts.import_nemesis_snapshot
            python -m scripts.build_osint_china
            python scripts/seal_readings.py
            python -m pytest -q \
              tests/test_import_nemesis_snapshot.py \
              tests/test_egress_policy.py \
              tests/test_osint_china.py \
              tests/test_safe_fetch.py \
              tests/test_seal_readings.py \
              tests/test_publication_contract.py
            python scripts/verify_public_surface.py

            git add readings/osint-china-latest.json
            if [ -e readings/nemesis-latest.json ]; then
              git add readings/nemesis-latest.json
            fi
            git add readings/readings-ledger.jsonl
            if git diff --cached origin/main --quiet; then
              echo "no change after rebase"
              exit 0
            fi
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
              git commit -m "data: OSINT China refresh ($(date -u +%FT%TZ)) [skip ci]"
            else
              git commit --amend --no-edit
            fi
            git push origin HEAD:main
          fi
