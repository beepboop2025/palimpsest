[Unit]
RequiresMountsFor=/var/lib/palimpsest-private-osint-history
AssertPathIsMountPoint=/var/lib/palimpsest-private-osint-history
Requires=palimpsest-native-osint-lineage.service
After=palimpsest-native-osint-lineage.service

[Service]
WorkingDirectory=/usr/local/libexec/palimpsest-native-osint/current
ExecStartPre=
ExecStartPre=/usr/bin/test -x /usr/bin/git
ExecStartPre=/bin/sh /usr/local/libexec/palimpsest-native-osint/current/verify-history-mount.sh
ExecStartPre=/usr/bin/test /var/lib/palimpsest-private-osint-history -ef /var/lib/palimpsest-public-osint-sync/native-history
ExecStartPre=/bin/sh /usr/local/libexec/palimpsest-native-osint/current/verify-host-bundle.sh
ExecStartPre=/usr/bin/cmp -s /usr/local/libexec/palimpsest-native-osint/current/REVISION /etc/palimpsest/osint-native-source
ExecStart=
ExecStart=/usr/bin/python3 -EsB /usr/local/libexec/palimpsest-native-osint/current/native_osint_sync.py
ExecStartPost=
ExecStartPost=/usr/bin/python3 -EsB /usr/local/libexec/palimpsest-native-osint/current/native_osint_sync.py --verify-installed
ReadOnlyPaths=/usr/local/libexec/palimpsest-native-osint /etc/palimpsest/osint-native-source /etc/palimpsest/native-publication-lineage.json /etc/palimpsest/private-native-osint-admission.json /run/palimpsest-private-native-proof /var/lib/palimpsest/hetzner-publication
BindPaths=/var/lib/palimpsest-private-osint-history:/var/lib/palimpsest-public-osint-sync/native-history
