name: Refresh Data darkness watch

# Publication-cadence watch over seven official Chinese data surfaces:
# pbc.gov.cn OMO announcements and the Money & Banking Statistics directory
# (monetary-authority balance sheet block), the safe.gov.cn bank FX
# settlement page, the repo's own CFETS benchmark history, the stats.gov.cn
# energy and industrial monthlies (scored against the state's own release
# calendar), and nra.gov.cn rail freight. The signal is days-late against
# each surface's own rhythm — the withholding complement to the deletion
# signals, scoped as future work in docs/VALIDATION.md and live here.
# Stdlib-only, vantage-insensitive — runs correctly from a GitHub runner (no
# box egress). Daily after the Beijing business day; the OMO announcement
# lands in the Beijing morning, so 10:07 UTC reads a settled day.

on:
  schedule:
    - cron: "7 10 * * *"       # daily, minute offset from the other signals
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-darkness-refresh
  cancel-in-progress: false

jobs:
  data-darkness:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the pinned offline test runner
        run: >-
          python -m pip install --quiet --require-hashes
          -r .github/osint-china-ci-requirements.txt

      - name: Synchronize inputs before computation
        run: |
          git config user.name "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git fetch origin main
          git rebase origin/main

      - name: Read the publication surfaces and publish the data-darkness signal
        run: python -m scripts.data_darkness_pull

      - name: Rebuild and seal the aggregate that embeds the signal
        run: |
          python -m scripts.build_osint_china --input-commit "$(git rev-parse HEAD)"
          python scripts/seal_readings.py

      - name: Verify the signal, aggregate, and publication contract
        run: |
          python -m pytest -q \
            tests/test_data_darkness.py \
            tests/test_data_darkness_pull_publish.py \
            tests/test_osint_china.py \
            tests/test_osint_china_page.py \
            tests/test_seal_readings.py \
            tests/test_publication_contract.py \
            tests/test_public_surface_scrub.py

      - name: Read the public surface before pushing it
        # This repository is served in full by Pages, so the push below is the publication
        # act and this is the last point at which a match can still be stopped. The test
        # workflow cannot cover this commit: it carries [skip ci], and GitHub skips the
        # whole run rather than one job. Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Create the candidate refresh commit
        id: candidate
        run: |
          git add \
            readings/data-darkness-latest.json \
            readings/data-darkness-history.jsonl \
            readings/osint-china-latest.json \
            readings/readings-ledger.jsonl
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change"
          else
            git commit -m "data: data darkness refresh ($(date -u +%FT%TZ)) [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase the candidate onto the latest public inputs
        if: steps.candidate.outputs.changed == 'true'
        id: prepublish_sync
        run: |
          candidate=$(git rev-parse HEAD)
          previous_base=$(git rev-parse HEAD^)
          git fetch origin main
          if git rebase origin/main; then
            current_base=$(git rev-parse HEAD^)
            if [ "$previous_base" = "$current_base" ]; then
              echo "rebuild=false" >> "$GITHUB_OUTPUT"
            else
              echo "rebuild=true" >> "$GITHUB_OUTPUT"
            fi
            echo "recreate=false" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort || true
            git switch --detach origin/main
            git checkout "$candidate" -- \
              readings/data-darkness-latest.json \
              readings/data-darkness-history.jsonl
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "recreate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild and reseal after a pre-publication input change
        if: steps.prepublish_sync.outputs.rebuild == 'true'
        run: |
          python -m scripts.build_osint_china --input-commit "$(git rev-parse origin/main)"
          python scripts/seal_readings.py

      - name: Retest after a pre-publication input change
        if: steps.prepublish_sync.outputs.rebuild == 'true'
        run: |
          python -m pytest -q \
            tests/test_data_darkness.py \
            tests/test_data_darkness_pull_publish.py \
            tests/test_osint_china.py \
            tests/test_osint_china_page.py \
            tests/test_seal_readings.py \
            tests/test_publication_contract.py \
            tests/test_public_surface_scrub.py

      - name: Rescrub after a pre-publication input change
        if: steps.prepublish_sync.outputs.rebuild == 'true'
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Replace the candidate with the revalidated bytes
        if: steps.prepublish_sync.outputs.rebuild == 'true'
        run: |
          git add \
            readings/data-darkness-latest.json \
            readings/data-darkness-history.jsonl \
            readings/osint-china-latest.json \
            readings/readings-ledger.jsonl
          if [ "${{ steps.prepublish_sync.outputs.recreate }}" = "true" ]; then
            if git diff --cached --quiet; then
              echo "no change after synchronization"
            else
              git commit -m "data: data darkness refresh ($(date -u +%FT%TZ)) [skip ci]"
            fi
          else
            git commit --amend --no-edit
          fi

      - name: Push the verified refresh
        if: steps.candidate.outputs.changed == 'true'
        run: git push origin HEAD:main
