name: Refresh Silence Index

# Pre-emptive silence: topics loud abroad while absent from the domestic
# board — the censorship that leaves no deletion to count (Peng Shuai, the
# youth-unemployment suspension). Scores the live DDTI terms against GDELT
# global volume with the weibo hot-search join as the permitted domestic
# proxy; every guard rail (china-nexus gate, corroboration requirement,
# abstain-over-fabricate) lives in processors/silence_index.py. Stdlib-only,
# keyless, vantage-insensitive — runs correctly from a GitHub runner.

on:
  schedule:
    - cron: "33 * * * *"       # hourly, after the hourly Weibo archive read
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: silence-index-refresh
  cancel-in-progress: false

jobs:
  silence-index:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Score pre-emptive silence and publish the silence-index signal
        run: python -m scripts.silence_index_pull

      - name: Validate schema compatibility and publication honesty
        run: >-
          python -m pytest -q
          tests/test_silence_index.py
          tests/test_silence_index_pull_publish.py
          tests/test_publication_contract.py

      - name: Read the public surface before pushing it
        # This repository is served in full by Pages, so the push below is the publication
        # act and this is the last point at which a match can still be stopped. The test
        # workflow marks the commit [skip pytest] so Tests/pytest skips; Tests/contract still runs. GitHub does not skip the
        # whole run rather than one job. Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit & push if the signal changed
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git add readings/silence-index-latest.json readings/silence-index-history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: silence index refresh ($(date -u +%FT%TZ)) [skip pytest]"
            python scripts/push_data_commit.py \
              --rebuild-module scripts.silence_index_pull \
              --stage readings/silence-index-latest.json \
              --stage readings/silence-index-history.jsonl \
              --input-path readings/ddti-latest.json \
              --input-path readings/weibo-hotsearch-latest.json
          fi
