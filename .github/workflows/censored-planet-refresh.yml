name: Refresh Censored Planet signal

# Independent China censorship measurement from Censored Planet (U. Michigan)
# via their open GraphQL API: interference rate + alert time series, measured
# by remote DNS/HTTP side-channels from 95k+ vantage points — a different method
# than OONI's active probes. Stdlib-only, key-less, vantage-insensitive.
# CP publishes ~weekly, so a daily poll is plenty.

on:
  schedule:
    - cron: "37 5 * * *"     # once daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: censored-planet-refresh
  cancel-in-progress: false

jobs:
  censored-planet:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Pull Censored Planet CN data and publish the signal
        run: python -m scripts.censored_planet_pull

      - name: Validate downstream selectors without publishing derived output
        run: python -B -m scripts.validate_investigation_dependencies

      - name: Read the public surface before pushing it
        # The push below advances auditable Git state; Pages deploys only an exact
        # SHA after its complete-graph contract passes, so this is the pre-push
        # boundary and this is the last point at which a match can still be stopped. The test
        # publisher marks [skip pytest] to identify the contract-only lane, then dispatches
        # the exact accepted SHA because action-token pushes emit no ordinary push event.
        # Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit & push if the signal changed
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git add readings/censored-planet-latest.json readings/censored-planet-history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: Censored Planet signal refresh ($(date -u +%FT%TZ)) [skip pytest]"
            PALIMPSEST_ACTIONS_TOKEN="${{ github.token }}" python scripts/push_data_commit.py \
              --check-module scripts.validate_investigation_dependencies
          fi
