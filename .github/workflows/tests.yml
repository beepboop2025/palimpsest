name: Tests

# The test suite, run as a gate rather than as advice. Until this existed, every
# guard test in the repo — including tests/test_no_dangerous_sinks.py, which is the
# thing standing between a future edit and a code-execution sink on a collection
# path — could only fail on someone's laptop. A guard that cannot fail the build is
# documentation, not a guard.
#
# Two suites, one command:
#   tests/            — the observatory's own suite, including strict JSON Schema
#                       publication contracts.
#   censorwatch/tests — the velocity leg's suite, which DOES need the installed
#                       dependencies (pandas et al.); it is only meaningful after
#                       `pip install -r requirements.txt`, which is why this
#                       workflow installs before running rather than relying on the
#                       stdlib-only invocation the README documents for local use.
#
# No secrets, no network reads: nothing here collects data. The suites are offline.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # Data-refresh workflows mark commits [skip pytest], which is NOT a GitHub-native
    # skip token. The Tests workflow still starts. This job skips the full suite on
    # those data commits; the contract job below still reads what they published.
    # Do not use [skip ci] / [ci skip] / [no ci]: GitHub would skip the entire
    # workflow, including contract.
    if: ${{ !contains(github.event.head_commit.message, '[skip pytest]') }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + test dependencies
        # censorwatch/tests need these; tests/ deliberately does not.
        run: pip install --quiet -r requirements.txt

      - name: Exercise the validated backup contract
        run: |
          bash -n \
            ops/backup/palimpsest-backup.sh \
            ops/backup/test-backup.sh \
            ops/backup/palimpsest-node-offsite-backup.sh \
            ops/node-offsite/install-host-bundle.sh
          sh -n ops/node-offsite/verify-host-bundle.sh
          test "$(grep -c '^OnSuccess=palimpsest-node-offsite-backup.service$' \
            ops/systemd/palimpsest-backup.offsite-trigger.conf)" = 1
          bash ops/backup/test-backup.sh
          python -m pytest -q \
            tests/test_node_backup_snapshot.py \
            tests/test_node_offsite_backup.py \
            tests/test_node_offsite_deployment.py

      - name: Run the full suite
        run: python -m pytest tests/ censorwatch/tests/ -q

  contract:
    # THE READING VALIDATORS. This job has no skip guard. Refresh commits use
    # [skip pytest] so this job still runs against the bytes that landed.
    #
    # It also runs the three integrity verifiers. Those live inside erasure-refresh today,
    # so a change that breaks the ledger verifier is caught only if it happens to touch that
    # workflow — the one guarantee the project asks readers to check for themselves should
    # not depend on which cron fired.
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the hash-pinned contract environment
        # NOT -r requirements.txt. The contract job needs pytest plus JSON Schema and its
        # format validators, all pinned to reviewed Python 3.12 Linux wheel hashes.
        run: pip install --quiet --require-hashes -r .github/osint-china-ci-requirements.txt

      - name: Validate what is actually published
        run: |
          python -m pytest -q \
            tests/test_publication_contract.py \
            tests/test_erasure_layer_freshness.py \
            tests/test_board_stale_is_not_calm.py \
            tests/test_cadence_matches_crons.py \
            tests/test_method_version_guard.py \
            tests/test_eval_assurance.py \
            tests/test_eval_journal.py \
            tests/test_econ_ledger.py::test_published_schema_accepts_every_current_ledger_row \
            tests/test_china_econ_manifest.py::test_manifest_schema_accepts_generated_public_and_fixture_documents \
            tests/test_china_econ_forecast_publish.py::test_strict_schema_accepts_the_public_artifact \
            tests/test_china_site.py::test_json_schema_is_valid_and_validates_the_index \
            tests/test_china_situation.py \
            tests/test_erasure_trail.py \
            tests/test_event_interconnection.py \
            tests/test_mcp_deployment.py

      - name: Check the committed deterministic machine-newsroom graph
        run: |
          # These checks MUST precede every write-mode builder below. Otherwise a
          # tampered committed artifact could be silently replaced and then pass its
          # check against the just-written bytes.
          #
          # The partner aggregate is admitted only through its separately reviewed,
          # hash-bound supersession receipt. CI validates that pin and never fetches
          # or auto-admits replacement partner bytes.
          python -m scripts.sync_narcoscope --check
          python -m core.evidence_mesh --check
          python -m core.machine_investigations --check
          python -m scripts.build_newsroom --check
          python -m scripts.build_china_econ_manifest --check
          python -m scripts.build_china_econ_forecast --check
          python -m scripts.build_china_site --check
          python -m scripts.build_data_catalog --check
          python -m scripts.build_china_situation --check
          python -m scripts.build_erasure_trail --check
          python scripts/seal_readings.py --check

      - name: Rebuild and prove the deterministic graph is unchanged
        run: |
          # Replay the already validated mesh at its recorded publication
          # clock.  A no-argument build intentionally means "publish a new
          # snapshot now" and therefore cannot prove byte reproducibility.
          mesh_clock=$(python -c 'import json; print(json.load(open("readings/evidence-mesh-latest.json"))["generated_at"])')
          catalog_clock=$(python -c 'import json; print(json.load(open("readings/catalog.json"))["generated_at"])')
          python -m core.evidence_mesh --now "$mesh_clock"
          python -m core.machine_investigations
          python -m scripts.build_newsroom
          python -m scripts.build_china_econ_manifest
          python -m scripts.build_china_econ_forecast
          python -m scripts.build_china_site
          python -m scripts.build_data_catalog --now "$catalog_clock"
          python -m scripts.build_china_situation
          python -m scripts.build_erasure_trail
          git diff --exit-code -- \
            readings/china-econ-observations-latest.json \
            readings/china-econ-forecast-latest.json \
            readings/china-index-latest.json \
            readings/evidence-mesh-latest.json \
            readings/machine-investigations-latest.json \
            readings/newsroom-latest.json \
            readings/china-situation-latest.json \
            readings/erasure-trail-latest.json \
            readings/catalog.json \
            readings/catalog.jsonld \
            datapackage.json \
            china/ \
            news/

      - name: Read the public surface
        # Refresh commits now use [skip pytest], so this job sees those pushes.
        # GitHub-native [skip pytest] is forbidden by scripts/push_data_commit.py.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Verify the tamper-evident chains
        # Offline, stdlib, no secrets — the same commands the site tells a reader to run.
        run: |
          python -m scripts.verify_ledger
          python -m scripts.verify_eval_registry
          python -m scripts.verify_refusal_transcripts || rc=$?
          if [ "${rc:-0}" = "1" ]; then exit 1; fi
          unset rc
          python -m scripts.verify_gfi_transcripts || rc=$?
          if [ "${rc:-0}" = "1" ]; then exit 1; fi
          python -m scripts.build_eval_assurance --check
          python -m scripts.build_eval_journal --check
          python -m scripts.build_eval_findings --check
