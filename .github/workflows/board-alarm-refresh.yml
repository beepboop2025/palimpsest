name: Refresh board-level judgements

# The four board-level judgements, all pure local recomputation over the signal
# history JSONLs (no network, stdlib-only, deterministic):
#
#   board alarm    — e-BH selection across all monitored signals plus per-layer
#                    and board-wide merged e-values, so the false-alarm rate a
#                    reader is quoted is the family-wise one rather than twelve
#                    separate per-signal ones.
#   coverage guard — whether each signal's movement survives conditioning on its
#                    own sample size, so a shrinking measurement base is never
#                    published as a censorship change.
#   forecast ledger— the observatory's own track record: every signal forecast one
#                    step ahead from only its past, scored by a proper rule against
#                    what arrived, with the misses named.
#   cross-layer    — whether one layer of the apparatus moves before another, against
#                    a circular-shift null on differenced series (a naive correlation
#                    test on these autocorrelated signals is confidently wrong).
#
# Runs after the conformal event flags, which run after the signal pulls.

on:
  schedule:
    - cron: "53 */6 * * *"     # every 6 hours, after event-flags at :47
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: board-alarm-refresh
  cancel-in-progress: false

jobs:
  board-alarm:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Recompute the board alarm from signal histories
        run: python -m scripts.board_alarm_pull

      - name: Recompute the coverage guard from signal histories
        run: python -m scripts.coverage_guard_pull

      - name: Rescore the forecast ledger
        run: python -m scripts.forecast_ledger_pull

      - name: Recompute cross-layer lead/lag
        run: python -m scripts.cross_layer_pull

      - name: Read the public surface before pushing it
        # This repository is served in full by Pages, so the push below is the publication
        # act and this is the last point at which a match can still be stopped. The test
        # workflow cannot cover this commit: it carries [skip ci], and GitHub skips the
        # whole run rather than one job. Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit & push if any judgement changed
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git add readings/board-alarm-latest.json readings/board-alarm-history.jsonl \
                  readings/coverage-guard-latest.json readings/coverage-guard-history.jsonl \
                  readings/forecast-ledger-latest.json readings/forecast-ledger-history.jsonl \
                  readings/cross-layer-latest.json readings/cross-layer-history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: board alarm + coverage guard refresh ($(date -u +%FT%TZ)) [skip ci]"
            python scripts/push_data_commit.py \
              --rebuild-module scripts.board_alarm_pull \
              --rebuild-module scripts.coverage_guard_pull \
              --rebuild-module scripts.forecast_ledger_pull \
              --rebuild-module scripts.cross_layer_pull \
              --stage readings/board-alarm-latest.json \
              --stage readings/board-alarm-history.jsonl \
              --stage readings/coverage-guard-latest.json \
              --stage readings/coverage-guard-history.jsonl \
              --stage readings/forecast-ledger-latest.json \
              --stage readings/forecast-ledger-history.jsonl \
              --stage readings/cross-layer-latest.json \
              --stage readings/cross-layer-history.jsonl
          fi
