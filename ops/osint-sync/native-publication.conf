# Install as 95-native-publication.conf beside the retained Railway drop-in,
# only after the immutable native adapter bundle and its source marker pass the
# no-enable procedure in NATIVE-PUBLICATION.md. Removing this one file and
# reloading systemd restores the retired Railway adapter exactly as it was.
# RuntimeDirectory, the read-only canonical Git bind, the time and memory
# bounds and the base unit sandbox all still come from the earlier files.
[Service]
WorkingDirectory=/usr/local/libexec/palimpsest-native-osint/current
ExecStartPre=
ExecStartPre=/usr/bin/test -x /usr/bin/git
ExecStartPre=/usr/bin/test -x /usr/bin/python3
ExecStartPre=/usr/bin/test -f /etc/palimpsest/deployed-commit
ExecStartPre=/bin/sh /usr/local/libexec/palimpsest-native-osint/current/verify-host-bundle.sh
ExecStartPre=/usr/bin/cmp -s /usr/local/libexec/palimpsest-native-osint/current/REVISION /etc/palimpsest/osint-native-source
ExecStart=
ExecStart=/usr/bin/python3 -EsB /usr/local/libexec/palimpsest-native-osint/current/native_osint_sync.py
ExecStartPost=
ExecStartPost=/usr/bin/python3 -EsB /usr/local/libexec/palimpsest-native-osint/current/native_osint_sync.py --verify-installed
ReadOnlyPaths=/usr/local/libexec/palimpsest-native-osint /etc/palimpsest/osint-native-source /etc/palimpsest/native-publication-lineage.json
ReadOnlyPaths=/var/lib/palimpsest/hetzner-publication /srv/railway-migration-20261106/palimpsest-native
# The adapter reads receipts only. It never needs a delivery key or provider token.
InaccessiblePaths=-/srv/railway-migration-20261106/palimpsest-native/delivery_ed25519 -/etc/palimpsest/railway-publication.env
