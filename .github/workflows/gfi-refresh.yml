name: Refresh Generative Firewall Index

# Measure how state-aligned LLMs censor, via public model APIs (OpenRouter).
# Vantage-insensitive: a model refuses the same regardless of where you ask.
# Runs daily because each run spends model quota. The OPENROUTER_API_KEY secret
# is never printed and is NOT exposed here — this workflow only runs on schedule
# and manual dispatch, never on pull_request, so untrusted code can't read it.

on:
  schedule:
    - cron: "23 6 * * *"     # daily, ~06:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # GFI and erasure both append to the same eval registry. Keep one hosted writer
  # active at a time; the base-locked reseal paths still defend against other writers.
  group: eval-registry-writer
  cancel-in-progress: false

jobs:
  gfi:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the offline publication-contract verifier
        run: python -m pip install --quiet pytest

      - name: Synchronize before publishing the measurement protocol
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git fetch origin main
          git rebase origin/main

      - name: Publish the exact GFI v2 protocol before querying any model
        # This is a separate public commit, not merely an earlier line in the same
        # process. It freezes prompt text, panel, cohorts, k, method version and the
        # classifier bytes before the paid answers exist. If this push loses a race,
        # the job stops here and spends no model quota.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: |
          python -m scripts.preregister_gfi_v2
          python -m scripts.verify_eval_registry
          python scripts/verify_public_surface.py
          git add readings/gfi-evaluation-protocol-v2.json \
                  readings/eval-registry.jsonl \
                  readings/eval-registry-latest.json
          if git diff --cached --quiet; then
            echo "current protocol was already public"
          else
            git commit -m "eval: preregister GFI v2 protocol ($(date -u +%FT%TZ)) [skip pytest]"
            PALIMPSEST_ACTIONS_TOKEN="${{ github.token }}" python scripts/push_data_commit.py --base-locked
          fi

      - name: Run the generative-firewall reading
        run: python scripts/generative_firewall_reading.py

      - name: Recompute the protocol, transcripts, and dependent public graph
        run: |
          python -m scripts.verify_eval_registry
          python -m scripts.verify_gfi_transcripts
          python -m scripts.build_eval_assurance
          python -m scripts.build_eval_journal
          python -m scripts.build_eval_findings
          python -m scripts.build_erasure_trail
          python -m scripts.build_erasure_trail --check
          python -m scripts.build_osint_china --input-commit "$(git rev-parse HEAD)"
          python -m scripts.build_investigations
          python -m scripts.build_network_rounds
          python -m scripts.build_corroboration
          python -m scripts.build_editorial_readiness
          python -m core.evidence_mesh
          python -m core.machine_investigations
          python -m scripts.build_newsroom
          python -m scripts.build_newsroom --check
          python -m scripts.build_china_situation
          python -m scripts.build_china_situation --check
          python -m scripts.build_data_catalog
          python scripts/seal_readings.py
          python -m scripts.build_eval_assurance --check
          python -m scripts.build_eval_journal --check
          python -m scripts.build_eval_findings --check
          python -m core.evidence_mesh --check
          python -m core.machine_investigations --check
          python -m scripts.build_data_catalog --check
          python scripts/seal_readings.py --check
          python -m pytest -q \
            tests/test_osint_china.py \
            tests/test_investigations.py \
            tests/test_investigations_renderer.py \
            tests/test_corroboration.py \
            tests/test_network_rounds.py \
            tests/test_source_workflow.py \
            tests/test_editorial_readiness.py \
            tests/test_evidence_mesh.py \
            tests/test_machine_investigations.py \
            tests/test_machine_investigations_renderer.py \
            tests/test_structured_newsroom.py \
            tests/test_data_catalog.py \
            tests/test_seal_readings.py \
            tests/test_publication_contract.py \
            tests/test_erasure_layer_freshness.py \
            tests/test_board_stale_is_not_calm.py \
            tests/test_cadence_matches_crons.py \
            tests/test_method_version_guard.py \
            tests/test_eval_assurance.py \
            tests/test_eval_journal.py \
            tests/test_eval_articles.py \
            tests/test_eval_journal_renderer.py

      - name: Read the public surface before pushing it
        # The push below advances auditable Git state; Pages deploys only an exact
        # SHA after its complete-graph contract passes, so this is the pre-push
        # boundary and this is the last point at which a match can still be stopped. The test
        # publisher marks [skip pytest] to identify the contract-only lane, then dispatches
        # the exact accepted SHA because action-token pushes emit no ordinary push event.
        # Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Create the measured candidate
        id: candidate
        run: |
          for p in readings/latest.json \
                   readings/history.jsonl \
                   readings/generative-firewall-index.html \
                   readings/gfi-transcripts-latest.json \
                   readings/eval-registry.jsonl \
                   readings/eval-registry-latest.json \
                   readings/eval-assurance-latest.json \
                   readings/eval-journal-latest.json \
                   readings/eval-articles-latest.json \
                   readings/board-alarm-analysis.json \
                   readings/erasure-trail-latest.json \
                   readings/erasure-trail-history.jsonl \
                   readings/erasure-trail.csv \
                   readings/osint-china-latest.json \
                   readings/investigations-latest.json \
                   readings/corroboration-latest.json \
                   readings/network-rounds-latest.json \
                   readings/source-workflow-latest.json \
                   readings/editorial-readiness-latest.json \
                   readings/evidence-mesh-latest.json \
                   readings/machine-investigations-latest.json \
                   readings/newsroom-latest.json \
                   readings/china-article-stream-latest.json \
                   readings/china-situation-latest.json \
                   readings/china-censorship-analysis-latest.json \
                   readings/readings-ledger.jsonl \
                   readings/catalog.json \
                   readings/catalog.jsonld \
                   datapackage.json \
                   news/ \
                   evals/ \
                   journal/ ; do
            test -e "$p" || { echo "FATAL: expected GFI artifact is missing: $p"; exit 1; }
            git add "$p"
          done
          # Sealing rewrites the per-reading analysis receipts as one atomic graph.
          # Stage the generated trees, not a filename snapshot that can drift.
          git add -A -- readings news evals journal datapackage.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change"
          else
            git commit -m "data: generative firewall refresh ($(date -u +%FT%TZ)) [skip pytest]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt the base-locked publication
        if: steps.candidate.outputs.changed == 'true'
        id: push_attempt
        continue-on-error: true
        run: |
          set +e
          PALIMPSEST_ACTIONS_TOKEN="${{ github.token }}" python scripts/push_data_commit.py --base-locked --contract-scope complete
          publish_rc=$?
          set -e
          printf 'exit_code=%s\n' "$publish_rc" >> "$GITHUB_OUTPUT"
          exit "$publish_rc"

      - name: Refuse a non-race publication failure
        if: >-
          steps.push_attempt.outcome == 'failure' &&
          steps.push_attempt.outputs.exit_code != '75' &&
          steps.push_attempt.outputs.exit_code != '76'
        run: |
          echo "FATAL: GFI publication failed for a reason that is not a base advance"
          exit 1

      - name: Retry the exact contract event without rebuilding
        if: >-
          steps.push_attempt.outcome == 'failure' &&
          steps.push_attempt.outputs.exit_code == '76'
        env:
          PALIMPSEST_ACTIONS_TOKEN: ${{ github.token }}
        run: python scripts/dispatch_publication_contract.py --scope complete "$(git rev-parse HEAD)"

      - name: Reseal the measured bytes after a publication race
        if: steps.push_attempt.outputs.exit_code == '75'
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: |
          measurement_commit=$(git rev-parse HEAD)
          for attempt in 1 2 3 4; do
            echo "GFI publication retry $attempt/4: retaining responses, rebuilding seals"
            git fetch origin main
            # This is an ephemeral Actions checkout. A rejected candidate can
            # leave generated residue, so every retry starts at the public base.
            git reset --hard origin/main
            git clean -fd
            for p in readings/latest.json \
                     readings/history.jsonl \
                     readings/generative-firewall-index.html \
                     readings/gfi-transcripts-latest.json ; do
              git checkout "$measurement_commit" -- "$p"
            done

            python -m scripts.ingest_gfi_v2
            python -m scripts.build_eval_assurance
            python -m scripts.build_eval_journal
            python -m scripts.build_eval_findings
            python -m scripts.build_erasure_trail
            python -m scripts.build_erasure_trail --check
            python -m scripts.build_osint_china --input-commit "$(git rev-parse HEAD)"
            python -m scripts.build_investigations
            python -m scripts.build_network_rounds
            python -m scripts.build_corroboration
            python -m scripts.build_editorial_readiness
            python -m core.evidence_mesh
            python -m core.machine_investigations
            python -m scripts.build_newsroom
            python -m scripts.build_newsroom --check
            python -m scripts.build_china_situation
            python -m scripts.build_china_situation --check
            python -m scripts.build_data_catalog
            python scripts/seal_readings.py
            python -m scripts.verify_eval_registry
            python -m scripts.verify_gfi_transcripts
            python -m scripts.build_eval_assurance --check
            python -m scripts.build_eval_journal --check
            python -m scripts.build_eval_findings --check
            python -m core.evidence_mesh --check
            python -m core.machine_investigations --check
            python -m scripts.build_data_catalog --check
            python scripts/seal_readings.py --check
            python -m pytest -q \
              tests/test_osint_china.py \
              tests/test_investigations.py \
              tests/test_investigations_renderer.py \
              tests/test_corroboration.py \
              tests/test_network_rounds.py \
              tests/test_source_workflow.py \
              tests/test_editorial_readiness.py \
              tests/test_evidence_mesh.py \
              tests/test_machine_investigations.py \
              tests/test_machine_investigations_renderer.py \
              tests/test_structured_newsroom.py \
              tests/test_data_catalog.py \
              tests/test_seal_readings.py \
              tests/test_publication_contract.py \
              tests/test_erasure_layer_freshness.py \
              tests/test_board_stale_is_not_calm.py \
              tests/test_cadence_matches_crons.py \
              tests/test_method_version_guard.py \
              tests/test_eval_assurance.py \
              tests/test_eval_journal.py \
              tests/test_eval_articles.py \
              tests/test_eval_journal_renderer.py
            python scripts/verify_public_surface.py

            for p in readings/latest.json \
                     readings/history.jsonl \
                     readings/generative-firewall-index.html \
                     readings/gfi-transcripts-latest.json \
                     readings/eval-registry.jsonl \
                     readings/eval-registry-latest.json \
                     readings/eval-assurance-latest.json \
                     readings/eval-journal-latest.json \
                     readings/eval-articles-latest.json \
                     readings/board-alarm-analysis.json \
                     readings/erasure-trail-latest.json \
                     readings/erasure-trail-history.jsonl \
                     readings/erasure-trail.csv \
                     readings/osint-china-latest.json \
                     readings/investigations-latest.json \
                     readings/corroboration-latest.json \
                     readings/network-rounds-latest.json \
                     readings/source-workflow-latest.json \
                     readings/editorial-readiness-latest.json \
                     readings/evidence-mesh-latest.json \
                     readings/machine-investigations-latest.json \
                     readings/newsroom-latest.json \
                     readings/china-article-stream-latest.json \
                     readings/china-situation-latest.json \
                     readings/china-censorship-analysis-latest.json \
                     readings/readings-ledger.jsonl \
                     readings/catalog.json \
                     readings/catalog.jsonld \
                     datapackage.json \
                     news/ \
                     evals/ \
                     journal/ ; do
              git add "$p"
            done
            git add -A -- readings news evals journal datapackage.json
            if git diff --cached --quiet; then
              echo "the current public head already contains these measured bytes"
              exit 0
            fi
            git commit -C "$measurement_commit"
            set +e
            PALIMPSEST_ACTIONS_TOKEN="${{ github.token }}" python scripts/push_data_commit.py --base-locked --contract-scope complete
            publish_rc=$?
            set -e
            case "$publish_rc" in
              0) exit 0 ;;
              75) sleep $((attempt * 5)) ;;
              76)
                PALIMPSEST_ACTIONS_TOKEN="${{ github.token }}" \
                  python scripts/dispatch_publication_contract.py --scope complete "$(git rev-parse HEAD)"
                exit 0
                ;;
              *) exit "$publish_rc" ;;
            esac
          done
          echo "FATAL: GFI publication exhausted four verified reseal retries"
          exit 1
