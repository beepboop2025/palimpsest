name: Refresh CNY fix gap

# Two prices for one currency: the PBOC's 09:15 Beijing USD/CNY central
# parity (already collected by the china-econ signal) against the ECB's
# same-day reference rate (USD/CNY derived as EURCNY/EURUSD), cross-checked
# via Bank of Canada. Economic backdrop, not censorship — published as a
# reading, kept off the alarm board. Runs daily after the ECB file lands
# (~16:00 CET; 17:03 UTC clears it in winter and summer). Stdlib-only,
# keyless, vantage-insensitive.

on:
  schedule:
    - cron: "3 17 * * *"       # daily, minute offset from the other signals
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cny-fix-gap-refresh
  cancel-in-progress: false

jobs:
  cny-fix-gap:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Read both legs and publish the cny-fix-gap signal
        run: python -m scripts.cny_fix_gap_pull

      - name: Read the public surface before pushing it
        # The push below advances auditable Git state; Pages deploys only an exact
        # SHA after its complete-graph contract passes, so this is the pre-push
        # boundary and this is the last point at which a match can still be stopped. The test
        # publisher marks [skip pytest] to identify the contract-only lane, then dispatches
        # the exact accepted SHA because action-token pushes emit no ordinary push event.
        # Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit & push if the signal changed
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git add readings/cny-fix-gap-latest.json readings/cny-fix-gap-history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: cny fix gap refresh ($(date -u +%FT%TZ)) [skip pytest]"
            PALIMPSEST_ACTIONS_TOKEN="${{ github.token }}" python scripts/push_data_commit.py \
              --input-path readings/china-econ-history.jsonl
          fi
