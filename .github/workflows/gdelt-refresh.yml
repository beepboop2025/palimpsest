name: Refresh GDELT cross-signal

# Triangulate the live DDTI deletion terms against the open global news record
# (GDELT DOC 2.0 API): which censored topics are loud abroad (CONTAINMENT) vs
# conspicuously absent (BLACKOUT). Stdlib-only, key-less, vantage-insensitive —
# GDELT aggregates already-published world news, so it runs correctly anywhere.
# Reads readings/ddti-latest.json (published by the DDTI signal) as its input.

on:
  schedule:
    - cron: "47 */6 * * *"     # every 6 hours, offset from the DDTI run
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gdelt-refresh
  cancel-in-progress: false

jobs:
  gdelt:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Cross-reference DDTI terms against GDELT
        run: python -m scripts.gdelt_cross_pull

      - name: Read the public surface before pushing it
        # This repository is served in full by Pages, so the push below is the publication
        # act and this is the last point at which a match can still be stopped. The test
        # workflow marks the commit [skip pytest] so Tests/pytest skips; Tests/contract still runs. GitHub does not skip the
        # whole run rather than one job. Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit & push if the cross-signal changed
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git add readings/gdelt-latest.json readings/gdelt-history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: GDELT cross-signal refresh ($(date -u +%FT%TZ)) [skip pytest]"
            python scripts/push_data_commit.py \
              --input-path readings/ddti-latest.json
          fi
