name: Refresh DDTI index

# Recompute the live DDTI censorship index from China Digital Times' public
# feeds and publish it to palimpsest.info. Runs on a schedule with no secrets:
# GITHUB_TOKEN (contents: write) authorizes the push, so there is no deploy key
# and no server to keep online. CDT is a public overseas archive, so this pull
# is vantage-insensitive — the same reason the DDTI leg is safe to run anywhere.

on:
  schedule:
    - cron: "43 */3 * * *"   # every 3 hours (UTC), clear of the hourly wire start
  workflow_dispatch: {}        # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  # DDTI feeds the OSINT/newsroom graph. Keep it serialized with non-wire
  # graph publishers and offset it from the dedicated wire lane;
  # the wire publisher has exact-base race recovery for a concurrent source commit.
  group: derived-graph-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/ddti-requirements.txt

      - name: Install engine dependencies
        run: >-
          python -m pip install --quiet --require-hashes
          -r .github/ddti-requirements.txt

      - name: Compute live DDTI index from China Digital Times
        run: python -m scripts.ddti_live_pull

      - name: Inject the latest index into the dashboards + readings
        run: |
          IDX=$(find data/ddti -maxdepth 1 -type f -name 'index_*.json' -print | sort -r | sed -n '1p')
          if [ -z "$IDX" ]; then echo "no index produced (feeds unreachable?) — skipping"; exit 0; fi
          echo "injecting $IDX"
          python inject_ddti.py --index "$IDX" --repo .

      - name: Read the public surface before pushing it
        # The push below advances auditable Git state; Pages deploys only an exact
        # SHA after its complete-graph contract passes, so this is the pre-push
        # boundary and this is the last point at which a match can still be stopped. The test
        # publisher marks [skip pytest] to identify the contract-only lane, then dispatches
        # the exact accepted SHA because action-token pushes emit no ordinary push event.
        # Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit & push only if the published data changed
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git add dashboards/ddti_dashboard.html dashboards/ddti_observatory.html \
                  readings/ddti-latest.json readings/ddti-history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no data change — nothing to publish"
          else
            git commit -m "data: live DDTI refresh ($(date -u +%FT%TZ)) [skip pytest]"
            PALIMPSEST_ACTIONS_TOKEN="${{ github.token }}" python scripts/push_data_commit.py \
              --input-path readings/wayback-latest.json
          fi
