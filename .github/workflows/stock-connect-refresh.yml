name: Refresh Stock Connect telemetry

# HKEX Stock Connect daily statistics — southbound NET flow (the buy/sell
# split HKEX still prints) plus northbound turnover (the direction print
# was discontinued Aug-2024; that narrowing is itself part of the record).
# Per-day files are keyless but retention is roughly the current calendar
# year, so the git history file is the long record. Stdlib-only,
# vantage-insensitive — runs correctly from a GitHub runner.

on:
  schedule:
    - cron: "23 13 * * 1-5"    # 21:23 HKT — well after the daily print
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-connect-refresh
  cancel-in-progress: false

jobs:
  stock-connect:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Pull HKEX daily stats and publish the stock-connect signal
        run: python -m scripts.stock_connect_pull

      - name: Read the public surface before pushing it
        # This repository is served in full by Pages, so the push below is the publication
        # act and this is the last point at which a match can still be stopped. The test
        # workflow cannot cover this commit: it carries [skip ci], and GitHub skips the
        # whole run rather than one job. Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit & push if the signal changed
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git add readings/stock-connect-latest.json readings/stock-connect-history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: stock connect telemetry refresh ($(date -u +%FT%TZ)) [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
