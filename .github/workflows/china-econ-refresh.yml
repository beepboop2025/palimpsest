name: Refresh China econ telemetry

# Reviewed World Bank WDI China history under CC BY 4.0. CFETS/ChinaMoney
# collection is intentionally absent because the China economic source policy
# denies copying/transmitting/storing/publishing/processing those values without
# written licensing. The Git-tracked WDI ledger is the durable revision seed;
# raw responses remain in the attested review handoff rather than Pages.

on:
  # Deliberately manual through this release. Every refresh opens a PR; no
  # scheduled or action-token path may write the governed WDI files to main.
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: china-econ-refresh
  cancel-in-progress: false

jobs:
  china-econ:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the pinned offline test runner
        run: >-
          python -m pip install --quiet --require-hashes
          -r .github/osint-china-ci-requirements.txt

      - name: Synchronize inputs before collection
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git config user.name "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          branch="automation/china-econ-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -B "$branch" origin/main
          echo "REFRESH_BRANCH=$branch" >> "$GITHUB_ENV"
          git show HEAD:config/china_econ_wdi_series.json \
            > "$RUNNER_TEMP/china-econ-prior-registry.json"

      - name: Pull reviewed WDI values into the durable attributed ledger
        run: >-
          python -m scripts.china_econ_wdi_pull
          --prior-registry "$RUNNER_TEMP/china-econ-prior-registry.json"
          --ledger readings/china-econ-wdi-observations.jsonl
          --latest readings/china-econ-wdi-latest.json
          --public-context-only

      - name: Validate the append-only economic observation ledger
        run: |
          python -m scripts.china_econ_wdi_pull \
            --prior-registry "$RUNNER_TEMP/china-econ-prior-registry.json" \
            --ledger readings/china-econ-wdi-observations.jsonl \
            --latest readings/china-econ-wdi-latest.json \
            --public-context-only \
            --validate-only
          python -m scripts.build_china_econ_manifest --check

      - name: Rebuild and seal every dependent public surface
        run: |
          python -m scripts.build_economic_pulse
          python -m scripts.build_china_econ_forecast
          python -m scripts.build_china_econ_forecast --check
          python -m scripts.build_china_site
          python -m scripts.build_china_site --check
          python -m scripts.build_erasure_trail
          python -m scripts.build_erasure_trail --check
          python -m scripts.build_osint_china --input-commit "$(git rev-parse HEAD)"
          python -m scripts.build_investigations
          python -m scripts.build_network_rounds
          python -m scripts.build_corroboration
          python -m scripts.build_editorial_readiness
          python -m scripts.sync_narcoscope --check
          python -m scripts.sync_narcoscope --remote-check || true
          python -m core.evidence_mesh
          python -m core.evidence_mesh --check
          python -m core.machine_investigations
          python -m core.machine_investigations --check
          python -m scripts.build_newsroom
          python -m scripts.build_newsroom --check
          python -m scripts.build_china_situation
          python -m scripts.build_china_situation --check
          python -m scripts.build_data_catalog
          python scripts/seal_readings.py

      - name: Verify the observation, synthesis and publication contracts
        run: |
          python -m pytest -q \
            tests/test_china_econ_observatory.py \
            tests/test_world_bank_wdi.py \
            tests/test_china_econ_export.py \
            tests/test_china_econ_pull_publish.py \
            tests/test_econ_ledger.py \
            tests/test_china_econ_manifest.py \
            tests/test_china_econ_backtest.py \
            tests/test_china_econ_forecast_publish.py \
            tests/test_economic_pulse.py \
            tests/test_china_site.py \
            tests/test_china_renderer.py \
            tests/test_osint_china.py \
            tests/test_osint_china_page.py \
            tests/test_investigations.py \
            tests/test_investigations_renderer.py \
            tests/test_evidence_mesh.py \
            tests/test_machine_investigations.py \
            tests/test_machine_investigations_renderer.py \
            tests/test_primary_documents.py \
            tests/test_corroboration.py \
            tests/test_network_rounds.py \
            tests/test_source_workflow.py \
            tests/test_editorial_readiness.py \
            tests/test_structured_newsroom.py \
            tests/test_evidence_wire_publication.py \
            tests/test_ai_discovery.py \
            tests/test_data_catalog.py \
            tests/test_seal_readings.py \
            tests/test_publication_contract.py \
            tests/test_public_surface_scrub.py

      - name: Read the public surface before pushing it
        # The push below advances auditable Git state; Pages deploys only an exact
        # SHA after its complete-graph contract passes, so this is the pre-push
        # boundary and this is the last point at which a match can still be stopped. The test
        # publisher marks [skip pytest] to identify the contract-only lane, then dispatches
        # the exact accepted SHA because action-token pushes emit no ordinary push event.
        # Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit and open one reviewed refresh PR if the signal changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add \
            readings/china-econ-latest.json \
            readings/china-econ-history.jsonl \
            readings/china-econ-observations.jsonl \
            readings/china-econ-observations-latest.json \
            readings/china-econ-wdi-observations.jsonl \
            readings/china-econ-wdi-latest.json \
            readings/china-econ-forecast-latest.json \
            readings/china-economic-pulse-latest.json \
            readings/china-index-latest.json \
            readings/erasure-trail-latest.json \
            readings/erasure-trail-history.jsonl \
            readings/erasure-trail.csv \
            readings/osint-china-latest.json \
            readings/investigations-latest.json \
            readings/evidence-mesh-latest.json \
            readings/machine-investigations-latest.json \
            readings/primary-documents-latest.json \
            readings/corroboration-latest.json \
            readings/network-rounds-latest.json \
            readings/source-workflow-latest.json \
            readings/editorial-readiness-latest.json \
            readings/newsroom-latest.json \
            readings/china-article-stream-latest.json \
            readings/china-situation-latest.json \
            readings/china-censorship-analysis-latest.json \
            readings/readings-ledger.jsonl \
            readings/catalog.json \
            readings/catalog.jsonld \
            datapackage.json \
            china/ \
            news/
          git add -A -- readings china news datapackage.json
          if git status --porcelain=v1 --untracked-files=all | grep -q .; then
            echo "unstaged after git add:"
            git status --porcelain=v1 --untracked-files=all | head -80
          fi
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: propose China econ telemetry refresh ($(date -u +%FT%TZ))"
            git push --set-upstream origin "HEAD:refs/heads/$REFRESH_BRANCH"
            gh pr create \
              --base main \
              --head "$REFRESH_BRANCH" \
              --title "data: review China economic telemetry refresh" \
              --body $'Automated reviewed-input candidate.\n\nThis PR never self-merges. Merge only through the GitHub reviewed merge-commit path after the complete hosted contract is green.'
          fi
