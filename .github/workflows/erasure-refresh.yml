name: Refresh Information Erasure Observatory

# The unifying publication lane. It reads the latest OONI/GFI/Baike surface
# readings, runs the keyed frontier refusal-drift audit when configured, seals the
# evidence into the tamper-evident ledgers, and publishes the composite Erasure
# Index plus integrity proofs. The aggregate builder itself is key-less and does
# not re-measure its inputs; this workflow also owns the paid model observation.

on:
  schedule:
    - cron: "8 */6 * * *"       # every 6h, clear of DDTI/newswire's shared :17 lane
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: "Erasure run whose retained refusal measurement should be republished without model calls"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  # GFI and erasure both append to the same eval registry. A shared writer lane
  # prevents the known workflows from producing competing registry tails.
  group: eval-registry-writer
  cancel-in-progress: false

jobs:
  erasure:
    runs-on: ubuntu-latest
    # A full refusal-drift sweep can legitimately take more than an hour, but a
    # provider connection must not hold this publication lane forever.
    timeout-minutes: 150
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the hash-pinned eval publication test environment
        run: >-
          python -m pip install --quiet --require-hashes
          -r .github/osint-china-ci-requirements.txt

      - name: Synchronize inputs before the long model sweep
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git fetch origin main
          git rebase origin/main

      - name: Verify the ledger before sealing (fail loud on any prior tamper)
        run: python -m scripts.verify_ledger

      - name: Refresh the narrative layer (Baike redaction-diff)
        # The public runner is permanently inert pending an authorized source path.
        # No secret or environment variable can activate Baike acquisition. This step
        # records the disabled state without changing the last observation timestamp;
        # the composite below then exposes the retained reading as stale/unavailable.
        run: python -m scripts.baike_redaction_pull

      - name: Refresh the public Baike article snapshot
        # Public HTML GET only. Not the Wikipedia-fork collector. A 403 from
        # Baidu is published as unreachable, never as a rewrite.
        run: python -m scripts.baike_public_snapshot_pull

      - name: Seal current readings and publish the composite index
        run: python -m scripts.erasure_pull

      - name: Refresh the Verifiable Eval Registry (seal model-erasure audit)
        run: python -m scripts.eval_registry_ingest

      - name: Frontier refusal-drift audit (real models; abstains without a key)
        if: github.event_name != 'workflow_dispatch' || inputs.recovery_run_id == ''
        # Seals a fresh run of each panel model and records drift versus the last
        # comparable run. Abstains cleanly if OPENROUTER_API_KEY is not configured.
        #
        # Cadence, deliberately split: the CANONICAL arm runs on every one of these
        # six-hourly refreshes, which is what keeps the drift series continuous with
        # the runs already sealed under the v1 probe-set hash. The paraphrase and
        # Chinese arms run on the first refresh of each UTC day — wording invariance
        # and language asymmetry move on a scale of weeks, and a paid API is not free.
        # The driver decides which it is by reading its own last_full_sweep_at, so no
        # second cron and no calendar logic here.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        timeout-minutes: 110
        run: python -m scripts.refusal_drift_pull

      - name: Recover a retained paid measurement without requerying models
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          case "$RECOVERY_RUN_ID" in
            ""|*[!0-9]*)
              echo "FATAL: recovery_run_id must contain decimal digits only"
              exit 1
              ;;
          esac
          source_workflow=$(gh run view "$RECOVERY_RUN_ID" --json workflowName --jq '.workflowName')
          if [ "$source_workflow" != "Refresh Information Erasure Observatory" ]; then
            echo "FATAL: run $RECOVERY_RUN_ID belongs to an unexpected workflow: $source_workflow"
            exit 1
          fi
          recovery_dir=$(mktemp -d)
          gh run download "$RECOVERY_RUN_ID" \
            --name "refusal-drift-measurement-$RECOVERY_RUN_ID" \
            --dir "$recovery_dir"
          for name in refusal-drift-latest.json \
                      refusal-drift-history.jsonl \
                      refusal-drift-transcripts.json \
                      refusal-drift-churn.jsonl ; do
            source_path="$recovery_dir/$name"
            if [ ! -s "$source_path" ]; then
              echo "FATAL: retained measurement is missing or empty: $name"
              exit 1
            fi
            cp "$source_path" "readings/$name"
          done
          python -m scripts.eval_registry_ingest
          python -m scripts.ingest_refusal_drift

      - name: Verify the eval registry (chain + pre-registration rule)
        run: python -m scripts.verify_eval_registry

      - name: Verify the transcripts recompute the seal, and the labels the transcripts
        # The audit the chain alone cannot offer: the published responses must hash to
        # the sealed responses_hash, and every label must re-derive from that text with
        # the shipping classifier. A mismatch means the published evidence and the
        # sealed record have parted company, which is worth failing the run over.
        # Exit 2 (nothing published yet, e.g. no API key) is not a failure.
        run: |
          python -m scripts.verify_refusal_transcripts || rc=$?
          if [ "${rc:-0}" = "1" ]; then exit 1; fi

      - name: Retain the paid refusal measurement for publication recovery
        # Publication and anchoring happen after several shared-chain gates. Keep the
        # expensive source observation briefly so an infrastructure failure does not
        # force the same model calls to be purchased again. These are public evidence
        # artifacts, not credentials; the recovery script still validates every byte.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: refusal-drift-measurement-${{ github.run_id }}
          path: |
            readings/refusal-drift-latest.json
            readings/refusal-drift-history.jsonl
            readings/refusal-drift-transcripts.json
            readings/refusal-drift-churn.jsonl
          if-no-files-found: error
          retention-days: 7

      - name: Verify any published GFI v2 transcripts and rebuild eval assurance
        run: |
          python -m scripts.verify_gfi_transcripts || rc=$?
          if [ "${rc:-0}" = "1" ]; then exit 1; fi
          unset rc
          python -m scripts.build_eval_assurance
          python -m scripts.build_eval_journal
          python -m scripts.build_eval_findings
          python -m scripts.build_eval_assurance --check
          python -m scripts.build_eval_journal --check
          python -m scripts.build_eval_findings --check

      - name: Seal every published reading into the readings record
        # The other twenty-seven readings are regenerated in place by their own
        # workflows, so each file is a live view and yesterday's numbers are
        # gone. This seals the currently published bytes of ALL of them into
        # readings-ledger.jsonl, which the anchor step below then stamps into
        # Bitcoin along with the other two chains.
        #
        # Scope, stated honestly: this is a daily snapshot of the published
        # state, not a seal of every intermediate value. A reading that changes
        # twice between runs has only its latest state attested. Raising the
        # cadence is a schedule change, nothing else — append_seal is idempotent,
        # so extra runs cost nothing and add no entries.
        #
        # Exit 1 means the chain itself does not verify, which is a tamper
        # finding and fails the job. Exit 2 means the chain was extended but a
        # reading could not be read: those files belong to thirty other
        # workflows, and one of them shipping truncated JSON must not take down
        # this job, because everything above (the erasure-ledger appends, the
        # sealed registry entries, the refusal transcripts) is still uncommitted
        # at this point and would die with the runner. Same shape as the
        # transcript verification step above.
        run: |
          python3 scripts/seal_readings.py || rc=$?
          if [ "${rc:-0}" = "1" ]; then exit 1; fi

      - name: Read the candidate public surface before synchronization
        # This repository is served in full by Pages, so the push below is the publication
        # act. Check once before retaining the expensive model results in a candidate, then
        # again after the candidate has been rebuilt on the actual public chain head.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Create the candidate refresh commit
        id: candidate
        # ONE PATH AT A TIME, AND DELIBERATELY SO. `git add a b c` is atomic: a single
        # pathspec that matches nothing aborts the whole command with exit 128 and
        # stages NOTHING, even the paths that do exist. With `|| true` swallowing the
        # error and `git diff --cached --quiet` then reporting "no change", the step
        # prints no change and exits 0 while the ledger append, the sealed registry
        # entries, the readings and the OpenTimestamps proofs all die with the runner.
        #
        # That is not hypothetical. Adding two not-yet-created files to the old
        # combined list would have deadlocked this job permanently: nothing commits,
        # so the next run checks out the same pre-upgrade state and fails the same way,
        # for ever, with CI green the whole time. It is precisely the "suppression by
        # omission" failure docs/INTEGRITY.md says is at least supposed to be visible
        # as a gap in the cadence, arriving silently instead.
        #
        # So: loop, add only what exists, and let a genuine `git add` failure on a file
        # that IS there be loud rather than swallowed. Anchors are deliberately absent
        # here: anchoring happens only after the expensive result is reconciled with the
        # latest public chain, so we never stamp a candidate that cannot be published.
        run: |
          for p in readings/erasure-observatory-latest.json \
                   readings/erasure-observatory-history.jsonl \
                   readings/erasure-ledger.jsonl \
                   readings/readings-ledger.jsonl \
                   readings/baike-redaction-latest.json \
                   readings/baike-redaction-history.jsonl \
                   readings/baike-public-snapshot-latest.json \
                   readings/baike-public-snapshot-history.jsonl \
                   readings/eval-registry.jsonl \
                   readings/eval-registry-latest.json \
                   readings/eval-assurance-latest.json \
                   readings/eval-journal-latest.json \
                   readings/eval-articles-latest.json \
                   evals/ \
                   journal/ \
                   readings/refusal-drift-latest.json \
                   readings/refusal-drift-history.jsonl \
                   readings/refusal-drift-transcripts.json \
                   readings/refusal-drift-churn.jsonl ; do
            if [ -e "$p" ]; then
              git add "$p" || { echo "FATAL: git add failed for an existing path: $p"; exit 1; }
            else
              echo "skip (not produced this run): $p"
            fi
          done
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change"
          else
            git commit -m "data: erasure observatory refresh ($(date -u +%FT%TZ)) [skip pytest]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase the candidate onto the latest public inputs
        if: steps.candidate.outputs.changed == 'true'
        id: prepublish_sync
        run: |
          candidate=$(git rev-parse HEAD)
          previous_base=$(git rev-parse HEAD^)
          git fetch origin main
          if git rebase origin/main; then
            current_base=$(git rev-parse HEAD^)
            if [ "$previous_base" = "$current_base" ]; then
              echo "rebuild=false" >> "$GITHUB_OUTPUT"
            else
              # A shared chain is not a mergeable generated file. Preserve the new
              # public registry head, then re-attest this run's retained measurement
              # onto it in the rebuild step below.
              git restore --source=origin/main --staged --worktree \
                readings/readings-ledger.jsonl \
                readings/eval-registry.jsonl \
                readings/eval-registry-latest.json
              echo "rebuild=true" >> "$GITHUB_OUTPUT"
            fi
            echo "recreate=false" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort || true
            git switch --detach origin/main
            for p in readings/erasure-observatory-latest.json \
                     readings/erasure-observatory-history.jsonl \
                     readings/erasure-ledger.jsonl \
                     readings/baike-redaction-latest.json \
                     readings/baike-redaction-history.jsonl \
                     readings/baike-public-snapshot-latest.json \
                     readings/baike-public-snapshot-history.jsonl \
                     readings/refusal-drift-latest.json \
                     readings/refusal-drift-history.jsonl \
                     readings/refusal-drift-transcripts.json \
                     readings/refusal-drift-churn.jsonl ; do
              if git cat-file -e "$candidate:$p" 2>/dev/null; then
                git checkout "$candidate" -- "$p"
              fi
            done
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "recreate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the aggregate and shared seal after an input change
        if: steps.prepublish_sync.outputs.rebuild == 'true'
        run: |
          python -m scripts.eval_registry_ingest
          python -m scripts.ingest_refusal_drift
          python -m scripts.erasure_pull
          python -m scripts.build_eval_assurance
          python -m scripts.build_eval_journal
          python -m scripts.build_eval_findings
          python3 scripts/seal_readings.py || rc=$?
          if [ "${rc:-0}" = "1" ]; then exit 1; fi

      - name: Verify the reconciled eval and readings chains
        if: steps.candidate.outputs.changed == 'true'
        run: |
          python -m scripts.verify_ledger
          python -m scripts.verify_eval_registry
          python -m scripts.verify_refusal_transcripts || rc=$?
          if [ "${rc:-0}" = "1" ]; then exit 1; fi
          unset rc
          python -m scripts.verify_gfi_transcripts || rc=$?
          if [ "${rc:-0}" = "1" ]; then exit 1; fi
          python -m scripts.build_eval_assurance --check
          python -m scripts.build_eval_journal --check
          python -m scripts.build_eval_findings --check
          python3 scripts/seal_readings.py --check
          python -m pytest -q \
            tests/test_eval_assurance.py \
            tests/test_eval_journal.py \
            tests/test_eval_articles.py \
            tests/test_eval_journal_renderer.py

      - name: Anchor only the reconciled roots
        if: steps.candidate.outputs.changed == 'true'
        # Wayback snapshots the served chain files (a third-party dated copy;
        # it may lag one refresh behind until Pages rebuilds). OpenTimestamps
        # stamps the exact NEW roots. This must run after reconciliation: the
        # previous workflow anchored a local candidate and then lost it in a
        # rebase conflict six runs in a row.
        env:
          PALIMPSEST_WAYBACK_ACCESS_KEY: ${{ secrets.PALIMPSEST_WAYBACK_ACCESS_KEY }}
          PALIMPSEST_WAYBACK_SECRET_KEY: ${{ secrets.PALIMPSEST_WAYBACK_SECRET_KEY }}
        run: |
          pip install --quiet opentimestamps-client
          python -m scripts.anchor_roots

      - name: Read the reconciled public surface before publication
        if: steps.candidate.outputs.changed == 'true'
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Replace the candidate with the reconciled and anchored bytes
        if: steps.candidate.outputs.changed == 'true'
        run: |
          for p in readings/erasure-observatory-latest.json \
                   readings/erasure-observatory-history.jsonl \
                   readings/erasure-ledger.jsonl \
                   readings/readings-ledger.jsonl \
                   readings/baike-redaction-latest.json \
                   readings/baike-redaction-history.jsonl \
                   readings/baike-public-snapshot-latest.json \
                   readings/baike-public-snapshot-history.jsonl \
                   readings/eval-registry.jsonl \
                   readings/eval-registry-latest.json \
                   readings/eval-assurance-latest.json \
                   readings/eval-journal-latest.json \
                   readings/eval-articles-latest.json \
                   evals/ \
                   journal/ \
                   readings/refusal-drift-latest.json \
                   readings/refusal-drift-history.jsonl \
                   readings/refusal-drift-transcripts.json \
                   readings/refusal-drift-churn.jsonl \
                   readings/anchors.jsonl \
                   readings/anchors-latest.json \
                   readings/anchors/ ; do
            if [ -e "$p" ]; then
              git add "$p" || { echo "FATAL: git add failed for an existing path: $p"; exit 1; }
            fi
          done
          if [ "${{ steps.prepublish_sync.outputs.recreate }}" = "true" ]; then
            git commit -m "data: erasure observatory refresh ($(date -u +%FT%TZ)) [skip pytest]"
          else
            git commit --amend --no-edit
          fi

      - name: Attempt the verified push
        if: steps.candidate.outputs.changed == 'true'
        id: push_attempt
        continue-on-error: true
        run: python scripts/push_data_commit.py --base-locked

      - name: Reattest, reverify, and retry after a push race
        if: steps.push_attempt.outcome == 'failure'
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
          PALIMPSEST_WAYBACK_ACCESS_KEY: ${{ secrets.PALIMPSEST_WAYBACK_ACCESS_KEY }}
          PALIMPSEST_WAYBACK_SECRET_KEY: ${{ secrets.PALIMPSEST_WAYBACK_SECRET_KEY }}
        run: |
          measurement_commit=$(git rev-parse HEAD)
          for attempt in 1 2 3 4; do
            echo "publication retry $attempt/4: rebuilding from the current public head"
            git fetch origin main
            git switch --detach origin/main

            # Carry forward only this run's measured/model artifacts. Aggregates,
            # shared registries, derived seals, and anchors stay at origin/main until
            # rebuilt below. In particular, never replace a newer GFI registry tail
            # with the stale fork that happened to contain this refusal measurement.
            for p in readings/baike-redaction-latest.json \
                     readings/baike-redaction-history.jsonl \
                     readings/baike-public-snapshot-latest.json \
                     readings/baike-public-snapshot-history.jsonl \
                     readings/refusal-drift-latest.json \
                     readings/refusal-drift-history.jsonl \
                     readings/refusal-drift-transcripts.json \
                     readings/refusal-drift-churn.jsonl ; do
              if git cat-file -e "$measurement_commit:$p" 2>/dev/null; then
                git checkout "$measurement_commit" -- "$p"
              fi
            done

            python -m scripts.eval_registry_ingest
            python -m scripts.ingest_refusal_drift
            python -m scripts.erasure_pull
            python -m scripts.build_eval_assurance
            python -m scripts.build_eval_journal
            python -m scripts.build_eval_findings
            python3 scripts/seal_readings.py || rc=$?
            if [ "${rc:-0}" = "1" ]; then exit 1; fi
            unset rc
            python -m scripts.verify_ledger
            python -m scripts.verify_eval_registry
            python -m scripts.verify_refusal_transcripts || verify_rc=$?
            if [ "${verify_rc:-0}" = "1" ]; then exit 1; fi
            unset verify_rc
            python -m scripts.verify_gfi_transcripts || verify_rc=$?
            if [ "${verify_rc:-0}" = "1" ]; then exit 1; fi
            unset verify_rc
            python -m scripts.build_eval_assurance --check
            python -m scripts.build_eval_journal --check
            python -m scripts.build_eval_findings --check
            python3 scripts/seal_readings.py --check
            python -m pytest -q \
              tests/test_eval_assurance.py \
              tests/test_eval_journal.py \
              tests/test_eval_articles.py \
              tests/test_eval_journal_renderer.py
            python -m scripts.anchor_roots
            python scripts/verify_public_surface.py

            for p in readings/erasure-observatory-latest.json \
                     readings/erasure-observatory-history.jsonl \
                     readings/erasure-ledger.jsonl \
                     readings/readings-ledger.jsonl \
                     readings/baike-redaction-latest.json \
                     readings/baike-redaction-history.jsonl \
                     readings/baike-public-snapshot-latest.json \
                     readings/baike-public-snapshot-history.jsonl \
                     readings/eval-registry.jsonl \
                     readings/eval-registry-latest.json \
                     readings/eval-assurance-latest.json \
                     readings/eval-journal-latest.json \
                     readings/eval-articles-latest.json \
                     evals/ \
                     journal/ \
                     readings/refusal-drift-latest.json \
                     readings/refusal-drift-history.jsonl \
                     readings/refusal-drift-transcripts.json \
                     readings/refusal-drift-churn.jsonl \
                     readings/anchors.jsonl \
                     readings/anchors-latest.json \
                     readings/anchors/ ; do
              if [ -e "$p" ]; then
                git add "$p" || { echo "FATAL: git add failed for an existing path: $p"; exit 1; }
              fi
            done
            if git diff --cached --quiet; then
              echo "the winning public head already contains these verified bytes"
              exit 0
            fi
            git commit -C "$measurement_commit"

            if python scripts/push_data_commit.py --base-locked; then
              exit 0
            fi
            echo "publication retry $attempt/4 lost another race"
            sleep $((attempt * 5))
          done
          echo "FATAL: erasure publication exhausted four verified rebuild retries"
          exit 1
