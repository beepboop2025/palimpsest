name: Refresh public research-corpus ledger

# Metadata-only Git ref advertisements for five statically allowlisted public research
# repositories. A run that is halted or cannot complete all five reads publishes nothing.
# Every base change discards the candidate and recollects from the new public ledger so the
# append-only history is never rebased from a stale parent.

on:
  schedule:
    - cron: "31 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: research-corpus-refresh
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install the pinned offline test runner
        run: >-
          python -m pip install --quiet --require-hashes
          -r .github/osint-china-ci-requirements.txt

      - name: Synchronize before collection
        run: |
          git config user.name "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git fetch origin main
          git rebase origin/main

      - name: Collect one bounded metadata snapshot
        id: collect
        run: |
          corpus_json="$(python -m scripts.research_corpus_ingest --readings readings)"
          printf '%s\n' "$corpus_json"
          corpus_status="$(CORPUS_JSON="$corpus_json" python -c \
            'import json, os; print(json.loads(os.environ["CORPUS_JSON"])["status"])')"
          echo "status=$corpus_status" >> "$GITHUB_OUTPUT"
          case "$corpus_status" in
            success) echo "ready=true" >> "$GITHUB_OUTPUT" ;;
            halted|skipped) echo "ready=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected collector status: $corpus_status" >&2; exit 1 ;;
          esac

      - name: Build and seal the public artifacts
        if: steps.collect.outputs.ready == 'true'
        run: |
          python -m scripts.build_data_catalog
          python scripts/seal_readings.py

      - name: Verify the collector and publication boundary
        if: steps.collect.outputs.ready == 'true'
        run: |
          python -m pytest -q \
            tests/test_research_corpus.py \
            tests/test_data_catalog.py \
            tests/test_egress_policy.py \
            tests/test_safe_fetch.py \
            tests/test_seal_readings.py \
            tests/test_publication_contract.py \
            tests/test_public_surface_scrub.py

      - name: Read the complete public surface before publication
        if: steps.collect.outputs.ready == 'true'
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Create the candidate refresh commit
        if: steps.collect.outputs.ready == 'true'
        id: candidate
        run: |
          git add \
            readings/research-corpus-latest.json \
            readings/research-corpus-history.jsonl \
            readings/catalog.json \
            readings/catalog.jsonld \
            datapackage.json \
            readings/readings-ledger.jsonl
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change"
          else
            git commit -m "data: research corpus refresh ($(date -u +%FT%TZ)) [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard the candidate against a changed public ledger
        if: steps.candidate.outputs.changed == 'true'
        id: prepublish_sync
        run: |
          previous_base="$(git rev-parse HEAD^)"
          git fetch origin main
          if git rebase origin/main; then
            current_base="$(git rev-parse HEAD^)"
            if [ "$previous_base" = "$current_base" ]; then
              echo "rebuild=false" >> "$GITHUB_OUTPUT"
            else
              git switch --detach origin/main
              echo "rebuild=true" >> "$GITHUB_OUTPUT"
            fi
          else
            git rebase --abort
            git switch --detach origin/main
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recollect after a pre-publication ledger change
        if: steps.prepublish_sync.outputs.rebuild == 'true'
        id: prepublish_collect
        run: |
          corpus_json="$(python -m scripts.research_corpus_ingest --readings readings)"
          printf '%s\n' "$corpus_json"
          corpus_status="$(CORPUS_JSON="$corpus_json" python -c \
            'import json, os; print(json.loads(os.environ["CORPUS_JSON"])["status"])')"
          echo "status=$corpus_status" >> "$GITHUB_OUTPUT"
          case "$corpus_status" in
            success) echo "ready=true" >> "$GITHUB_OUTPUT" ;;
            halted|skipped) echo "ready=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected collector status: $corpus_status" >&2; exit 1 ;;
          esac

      - name: Rebuild and reseal after a pre-publication ledger change
        if: >-
          steps.prepublish_sync.outputs.rebuild == 'true' &&
          steps.prepublish_collect.outputs.ready == 'true'
        run: |
          python -m scripts.build_data_catalog
          python scripts/seal_readings.py

      - name: Retest after a pre-publication ledger change
        if: >-
          steps.prepublish_sync.outputs.rebuild == 'true' &&
          steps.prepublish_collect.outputs.ready == 'true'
        run: |
          python -m pytest -q \
            tests/test_research_corpus.py \
            tests/test_data_catalog.py \
            tests/test_egress_policy.py \
            tests/test_safe_fetch.py \
            tests/test_seal_readings.py \
            tests/test_publication_contract.py \
            tests/test_public_surface_scrub.py

      - name: Rescrub after a pre-publication ledger change
        if: >-
          steps.prepublish_sync.outputs.rebuild == 'true' &&
          steps.prepublish_collect.outputs.ready == 'true'
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit the revalidated candidate
        if: >-
          steps.prepublish_sync.outputs.rebuild == 'true' &&
          steps.prepublish_collect.outputs.ready == 'true'
        id: recreated
        run: |
          git add \
            readings/research-corpus-latest.json \
            readings/research-corpus-history.jsonl \
            readings/catalog.json \
            readings/catalog.jsonld \
            datapackage.json \
            readings/readings-ledger.jsonl
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change after synchronization"
          else
            git commit -m "data: research corpus refresh ($(date -u +%FT%TZ)) [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt the verified push
        if: >-
          steps.candidate.outputs.changed == 'true' &&
          (steps.prepublish_sync.outputs.rebuild != 'true' ||
          steps.recreated.outputs.changed == 'true')
        id: push_attempt
        continue-on-error: true
        env:
          GITHUB_PUSH_TOKEN: ${{ github.token }}
        run: |
          basic_auth="$(printf 'x-access-token:%s' "$GITHUB_PUSH_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic_auth" \
            push origin HEAD:main

      - name: Reset to the winning ledger after a push race
        if: steps.push_attempt.outcome == 'failure'
        run: |
          git fetch origin main
          git switch --detach origin/main

      - name: Recollect after a push race
        if: steps.push_attempt.outcome == 'failure'
        id: race_collect
        run: |
          corpus_json="$(python -m scripts.research_corpus_ingest --readings readings)"
          printf '%s\n' "$corpus_json"
          corpus_status="$(CORPUS_JSON="$corpus_json" python -c \
            'import json, os; print(json.loads(os.environ["CORPUS_JSON"])["status"])')"
          echo "status=$corpus_status" >> "$GITHUB_OUTPUT"
          case "$corpus_status" in
            success) echo "ready=true" >> "$GITHUB_OUTPUT" ;;
            halted|skipped) echo "ready=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected collector status: $corpus_status" >&2; exit 1 ;;
          esac

      - name: Rebuild and reseal after a push race
        if: steps.race_collect.outputs.ready == 'true'
        run: |
          python -m scripts.build_data_catalog
          python scripts/seal_readings.py

      - name: Retest after a push race
        if: steps.race_collect.outputs.ready == 'true'
        run: |
          python -m pytest -q \
            tests/test_research_corpus.py \
            tests/test_data_catalog.py \
            tests/test_egress_policy.py \
            tests/test_safe_fetch.py \
            tests/test_seal_readings.py \
            tests/test_publication_contract.py \
            tests/test_public_surface_scrub.py

      - name: Rescrub after a push race
        if: steps.race_collect.outputs.ready == 'true'
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit the race-safe rebuilt bytes
        if: steps.race_collect.outputs.ready == 'true'
        id: race_candidate
        run: |
          git add \
            readings/research-corpus-latest.json \
            readings/research-corpus-history.jsonl \
            readings/catalog.json \
            readings/catalog.jsonld \
            datapackage.json \
            readings/readings-ledger.jsonl
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change after push race"
          else
            git commit -m "data: research corpus refresh ($(date -u +%FT%TZ)) [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the race-safe rebuilt commit
        if: steps.race_candidate.outputs.changed == 'true'
        env:
          GITHUB_PUSH_TOKEN: ${{ github.token }}
        run: |
          basic_auth="$(printf 'x-access-token:%s' "$GITHUB_PUSH_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic_auth" \
            push origin HEAD:main
