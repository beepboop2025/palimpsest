name: Refresh vantage fusion

# Fuse the three China network-censorship vantages (OONI in-country, Censored
# Planet remote, net4people community) into one calibrated anomaly rate with a
# corroboration measure. Pure local recomputation over the committed vantage
# readings (no network), stdlib-only, deterministic — anyone can reproduce the
# fused number offline. Runs after the vantage refreshers each cycle.

on:
  schedule:
    - cron: "51 */6 * * *"     # every 6 hours, after the vantage pulls
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vantage-fusion-refresh
  cancel-in-progress: false

jobs:
  vantage-fusion:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Fuse the censorship vantages
        run: python -m scripts.vantage_fusion_pull

      - name: Validate downstream selectors without publishing derived output
        run: python -B -m scripts.validate_investigation_dependencies

      - name: Read the public surface before pushing it
        # The push below advances auditable Git state; Pages deploys only an exact
        # SHA after its complete-graph contract passes, so this is the pre-push
        # boundary and this is the last point at which a match can still be stopped. The test
        # publisher marks [skip pytest] to identify the contract-only lane, then dispatches
        # the exact accepted SHA because action-token pushes emit no ordinary push event.
        # Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit & push if the fused reading changed
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git add readings/vantage-fusion-latest.json readings/vantage-fusion-history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: vantage fusion refresh ($(date -u +%FT%TZ)) [skip pytest]"
            PALIMPSEST_ACTIONS_TOKEN="${{ github.token }}" python scripts/push_data_commit.py \
              --check-module scripts.validate_investigation_dependencies \
              --rebuild-module scripts.vantage_fusion_pull \
              --stage readings/vantage-fusion-latest.json \
              --stage readings/vantage-fusion-history.jsonl
          fi
