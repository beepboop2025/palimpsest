name: Refresh evidence wire

# Pull a closed RSS/Atom registry, then rebuild every deterministic publication that
# depends on it. The two scheduled starts keep the wire current without overlapping
# the :58 OSINT aging run in the normal case. A push race still rebuilds, reseals and
# rechecks the exact rebased tree before publication.

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: derived-graph-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/osint-china-ci-requirements.txt

      - name: Install the pinned offline test runner
        run: >-
          python -m pip install --quiet --require-hashes
          -r .github/osint-china-ci-requirements.txt

      - name: Synchronize inputs before collection
        run: |
          git config user.name "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git fetch origin main
          git rebase origin/main

      - name: Pull the evidence wire source receipts
        id: acquisition
        run: |
          python -m scripts.newswire_pull
          echo "base-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A run artifact in a public repository is not a private vault. Screen
      # the acquired bytes with the explicit identity rules before retention.
      # Missing rules or a match skips only the recovery artifact; it must not
      # turn a successful collection into an observatory outage.
      - name: Screen acquisition before artifact retention
        id: acquisition_scrub
        continue-on-error: true
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py --require-rules

      # Preserve the expensive network result before any unrelated derived
      # graph can fail. The artifact is never uploaded unless the acquisition
      # scrub above succeeds. The existing seal, full scrub, tests and atomic
      # publication boundary below remain unchanged. Artifact service trouble
      # must not turn a previously publishable refresh into an outage.
      - name: Preserve successful acquisition before materialization
        if: steps.acquisition_scrub.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: newswire-acquisition-${{ steps.acquisition.outputs.base-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ./readings/newswire-latest.json
            ./readings/newswire-versions.jsonl
          if-no-files-found: error
          retention-days: 3

      - name: Correlate, render and seal the evidence wire
        run: |
          python -m scripts.build_economic_pulse
          python -m scripts.build_china_econ_manifest
          python -m scripts.build_china_site
          python -m scripts.build_erasure_trail
          python -m scripts.build_erasure_trail --check
          python -m scripts.build_osint_china --input-commit "$(git rev-parse HEAD)"
          python -m scripts.build_investigations
          python -m scripts.build_network_rounds
          python -m scripts.build_corroboration
          python -m scripts.build_editorial_readiness
          python -m scripts.sync_narcoscope --check
          python -m scripts.sync_narcoscope --remote-check || true
          python -m core.evidence_mesh
          python -m core.evidence_mesh --check
          python -m core.machine_investigations
          python -m core.machine_investigations --check
          python -m scripts.build_newsroom
          python -m scripts.build_newsroom --check
          python -m scripts.build_china_situation
          python -m scripts.build_china_situation --check
          python -m scripts.build_data_catalog
          python scripts/seal_readings.py

      - name: Verify collection, security and publication contracts
        run: |
          python -m pytest -q \
            tests/test_newswire.py \
            tests/test_newswire_service.py \
            tests/test_economic_pulse.py \
            tests/test_econ_ledger.py \
            tests/test_china_econ_manifest.py \
            tests/test_china_site.py \
            tests/test_china_renderer.py \
            tests/test_egress_policy.py \
            tests/test_no_dangerous_sinks.py \
            tests/test_safe_fetch.py \
            tests/test_osint_china.py \
            tests/test_osint_china_page.py \
            tests/test_investigations.py \
            tests/test_investigations_renderer.py \
            tests/test_narcoscope_bridge.py \
            tests/test_evidence_mesh.py \
            tests/test_machine_investigations.py \
            tests/test_machine_investigations_renderer.py \
            tests/test_primary_documents.py \
            tests/test_corroboration.py \
            tests/test_network_rounds.py \
            tests/test_source_workflow.py \
            tests/test_editorial_readiness.py \
            tests/test_structured_newsroom.py \
            tests/test_event_analysis.py \
            tests/test_china_article_stream.py \
            tests/test_china_situation.py \
            tests/test_china_situation_renderer.py \
            tests/test_evidence_wire_renderer.py \
            tests/test_evidence_wire_publication.py \
            tests/test_ai_discovery.py \
            tests/test_data_catalog.py \
            tests/test_seal_readings.py \
            tests/test_publication_contract.py \
            tests/test_public_surface_scrub.py \
            tests/test_site_shell.py
          node --check assets/shell.js

      - name: Read the complete public surface before publication
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Create the candidate refresh commit
        id: candidate
        run: |
          git add \
            readings/newswire-latest.json \
            readings/newswire-versions.jsonl \
            readings/china-economic-pulse-latest.json \
            readings/china-econ-observations-latest.json \
            readings/china-index-latest.json \
            readings/erasure-trail-latest.json \
            readings/erasure-trail-history.jsonl \
            readings/erasure-trail.csv \
            readings/osint-china-latest.json \
            readings/investigations-latest.json \
            readings/evidence-mesh-latest.json \
            readings/machine-investigations-latest.json \
            readings/primary-documents-latest.json \
            readings/corroboration-latest.json \
            readings/network-rounds-latest.json \
            readings/source-workflow-latest.json \
            readings/editorial-readiness-latest.json \
            readings/newsroom-latest.json \
            readings/china-article-stream-latest.json \
            readings/china-situation-latest.json \
            readings/china-censorship-analysis-latest.json \
            readings/readings-ledger.jsonl \
            readings/catalog.json \
            readings/catalog.jsonld \
            datapackage.json \
            china/ \
            news/
          git add -A -- readings china news datapackage.json
          if git status --porcelain=v1 --untracked-files=all | grep -q .; then
            echo "unstaged after git add:"
            git status --porcelain=v1 --untracked-files=all | head -80
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change"
          else
            git commit -m "data: evidence wire refresh ($(date -u +%FT%TZ)) [skip pytest]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase candidate onto the latest public ledger
        if: steps.candidate.outputs.changed == 'true'
        id: prepublish_sync
        run: |
          previous_base=$(git rev-parse HEAD^)
          git fetch origin main
          if git rebase origin/main; then
            current_base=$(git rev-parse HEAD^)
            if [ "$previous_base" = "$current_base" ]; then
              echo "rebuild=false" >> "$GITHUB_OUTPUT"
            else
              echo "rebuild=true" >> "$GITHUB_OUTPUT"
            fi
            echo "recreate=false" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort || true
            git switch --detach origin/main
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "recreate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild and reseal after a pre-publication ledger change
        if: steps.prepublish_sync.outputs.rebuild == 'true'
        run: |
          python -m scripts.newswire_pull
          python -m scripts.build_economic_pulse
          python -m scripts.build_china_econ_manifest
          python -m scripts.build_china_site
          python -m scripts.build_erasure_trail
          python -m scripts.build_erasure_trail --check
          python -m scripts.build_osint_china --input-commit "$(git rev-parse origin/main)"
          python -m scripts.build_investigations
          python -m scripts.build_network_rounds
          python -m scripts.build_corroboration
          python -m scripts.build_editorial_readiness
          python -m scripts.sync_narcoscope --check
          python -m scripts.sync_narcoscope --remote-check || true
          python -m core.evidence_mesh
          python -m core.evidence_mesh --check
          python -m core.machine_investigations
          python -m core.machine_investigations --check
          python -m scripts.build_newsroom
          python -m scripts.build_newsroom --check
          python -m scripts.build_china_situation
          python -m scripts.build_china_situation --check
          python -m scripts.build_data_catalog
          python scripts/seal_readings.py

      - name: Retest after a pre-publication ledger change
        if: steps.prepublish_sync.outputs.rebuild == 'true'
        run: |
          python -m pytest -q \
            tests/test_newswire.py \
            tests/test_newswire_service.py \
            tests/test_economic_pulse.py \
            tests/test_econ_ledger.py \
            tests/test_china_econ_manifest.py \
            tests/test_china_site.py \
            tests/test_china_renderer.py \
            tests/test_egress_policy.py \
            tests/test_no_dangerous_sinks.py \
            tests/test_safe_fetch.py \
            tests/test_osint_china.py \
            tests/test_osint_china_page.py \
            tests/test_investigations.py \
            tests/test_investigations_renderer.py \
            tests/test_narcoscope_bridge.py \
            tests/test_evidence_mesh.py \
            tests/test_machine_investigations.py \
            tests/test_machine_investigations_renderer.py \
            tests/test_primary_documents.py \
            tests/test_corroboration.py \
            tests/test_network_rounds.py \
            tests/test_source_workflow.py \
            tests/test_editorial_readiness.py \
            tests/test_structured_newsroom.py \
            tests/test_event_analysis.py \
            tests/test_china_article_stream.py \
            tests/test_china_situation.py \
            tests/test_china_situation_renderer.py \
            tests/test_evidence_wire_renderer.py \
            tests/test_evidence_wire_publication.py \
            tests/test_ai_discovery.py \
            tests/test_data_catalog.py \
            tests/test_seal_readings.py \
            tests/test_publication_contract.py \
            tests/test_public_surface_scrub.py \
            tests/test_site_shell.py
          node --check assets/shell.js

      - name: Rescrub after a pre-publication ledger change
        if: steps.prepublish_sync.outputs.rebuild == 'true'
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Replace the candidate with revalidated bytes
        if: steps.prepublish_sync.outputs.rebuild == 'true'
        run: |
          git add \
            readings/newswire-latest.json \
            readings/newswire-versions.jsonl \
            readings/china-economic-pulse-latest.json \
            readings/china-econ-observations-latest.json \
            readings/china-index-latest.json \
            readings/erasure-trail-latest.json \
            readings/erasure-trail-history.jsonl \
            readings/erasure-trail.csv \
            readings/osint-china-latest.json \
            readings/investigations-latest.json \
            readings/evidence-mesh-latest.json \
            readings/machine-investigations-latest.json \
            readings/primary-documents-latest.json \
            readings/corroboration-latest.json \
            readings/network-rounds-latest.json \
            readings/source-workflow-latest.json \
            readings/editorial-readiness-latest.json \
            readings/newsroom-latest.json \
            readings/china-article-stream-latest.json \
            readings/china-situation-latest.json \
            readings/china-censorship-analysis-latest.json \
            readings/readings-ledger.jsonl \
            readings/catalog.json \
            readings/catalog.jsonld \
            datapackage.json \
            china/ \
            news/
          git add -A -- readings china news datapackage.json
          if git status --porcelain=v1 --untracked-files=all | grep -q .; then
            echo "unstaged after git add:"
            git status --porcelain=v1 --untracked-files=all | head -80
          fi
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            if git diff --cached --quiet origin/main; then
              echo "no change after synchronization"
            else
              git commit -m "data: evidence wire refresh ($(date -u +%FT%TZ)) [skip pytest]"
            fi
          else
            git commit --amend --no-edit
          fi

      - name: Preflight publication contract dispatch
        if: steps.candidate.outputs.changed == 'true'
        env:
          PALIMPSEST_ACTIONS_TOKEN: ${{ github.token }}
        run: python scripts/dispatch_publication_contract.py --check-environment

      - name: Attempt the verified push
        if: steps.candidate.outputs.changed == 'true'
        id: push_attempt
        continue-on-error: true
        env:
          GITHUB_PUSH_TOKEN: ${{ github.token }}
        run: |
          basic=$(printf 'x-access-token:%s' "$GITHUB_PUSH_TOKEN" | base64 | tr -d '\n')
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" \
            push origin HEAD:main

      - name: Synchronize after a push race
        if: steps.push_attempt.outcome == 'failure'
        run: |
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            git switch --detach origin/main
          fi

      - name: Rebuild and reseal after a push race
        if: steps.push_attempt.outcome == 'failure'
        run: |
          python -m scripts.newswire_pull
          python -m scripts.build_economic_pulse
          python -m scripts.build_china_econ_manifest
          python -m scripts.build_china_site
          python -m scripts.build_erasure_trail
          python -m scripts.build_erasure_trail --check
          python -m scripts.build_osint_china --input-commit "$(git rev-parse origin/main)"
          python -m scripts.build_investigations
          python -m scripts.build_network_rounds
          python -m scripts.build_corroboration
          python -m scripts.build_editorial_readiness
          python -m scripts.sync_narcoscope --check
          python -m scripts.sync_narcoscope --remote-check || true
          python -m core.evidence_mesh
          python -m core.evidence_mesh --check
          python -m core.machine_investigations
          python -m core.machine_investigations --check
          python -m scripts.build_newsroom
          python -m scripts.build_newsroom --check
          python -m scripts.build_china_situation
          python -m scripts.build_china_situation --check
          python -m scripts.build_data_catalog
          python scripts/seal_readings.py

      - name: Retest after a push race
        if: steps.push_attempt.outcome == 'failure'
        run: |
          python -m pytest -q \
            tests/test_newswire.py \
            tests/test_newswire_service.py \
            tests/test_economic_pulse.py \
            tests/test_econ_ledger.py \
            tests/test_china_econ_manifest.py \
            tests/test_china_site.py \
            tests/test_china_renderer.py \
            tests/test_egress_policy.py \
            tests/test_no_dangerous_sinks.py \
            tests/test_safe_fetch.py \
            tests/test_osint_china.py \
            tests/test_osint_china_page.py \
            tests/test_investigations.py \
            tests/test_investigations_renderer.py \
            tests/test_narcoscope_bridge.py \
            tests/test_evidence_mesh.py \
            tests/test_machine_investigations.py \
            tests/test_machine_investigations_renderer.py \
            tests/test_primary_documents.py \
            tests/test_corroboration.py \
            tests/test_network_rounds.py \
            tests/test_source_workflow.py \
            tests/test_editorial_readiness.py \
            tests/test_structured_newsroom.py \
            tests/test_event_analysis.py \
            tests/test_china_article_stream.py \
            tests/test_china_situation.py \
            tests/test_china_situation_renderer.py \
            tests/test_evidence_wire_renderer.py \
            tests/test_evidence_wire_publication.py \
            tests/test_ai_discovery.py \
            tests/test_data_catalog.py \
            tests/test_seal_readings.py \
            tests/test_publication_contract.py \
            tests/test_public_surface_scrub.py \
            tests/test_site_shell.py
          node --check assets/shell.js

      - name: Rescrub after a push race
        if: steps.push_attempt.outcome == 'failure'
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit the race-safe rebuilt bytes
        if: steps.push_attempt.outcome == 'failure'
        run: |
          git add \
            readings/newswire-latest.json \
            readings/newswire-versions.jsonl \
            readings/china-economic-pulse-latest.json \
            readings/china-econ-observations-latest.json \
            readings/china-index-latest.json \
            readings/erasure-trail-latest.json \
            readings/erasure-trail-history.jsonl \
            readings/erasure-trail.csv \
            readings/osint-china-latest.json \
            readings/investigations-latest.json \
            readings/evidence-mesh-latest.json \
            readings/machine-investigations-latest.json \
            readings/primary-documents-latest.json \
            readings/corroboration-latest.json \
            readings/network-rounds-latest.json \
            readings/source-workflow-latest.json \
            readings/editorial-readiness-latest.json \
            readings/newsroom-latest.json \
            readings/china-article-stream-latest.json \
            readings/china-situation-latest.json \
            readings/china-censorship-analysis-latest.json \
            readings/readings-ledger.jsonl \
            readings/catalog.json \
            readings/catalog.jsonld \
            datapackage.json \
            china/ \
            news/
          git add -A -- readings china news datapackage.json
          if git status --porcelain=v1 --untracked-files=all | grep -q .; then
            echo "unstaged after git add:"
            git status --porcelain=v1 --untracked-files=all | head -80
          fi
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            if git diff --cached --quiet; then
              echo "no change after push race"
            else
              git commit -m "data: evidence wire refresh ($(date -u +%FT%TZ)) [skip pytest]"
            fi
          else
            git commit --amend --no-edit
          fi

      - name: Push the race-safe rebuilt commit
        if: steps.push_attempt.outcome == 'failure'
        id: retry_push
        env:
          GITHUB_PUSH_TOKEN: ${{ github.token }}
        run: |
          basic=$(printf 'x-access-token:%s' "$GITHUB_PUSH_TOKEN" | base64 | tr -d '\n')
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" \
            push origin HEAD:main

      - name: Dispatch the exact publication contract
        if: >-
          ${{ always() && (steps.push_attempt.outcome == 'success' ||
          steps.retry_push.outcome == 'success') }}
        env:
          PALIMPSEST_ACTIONS_TOKEN: ${{ github.token }}
        run: python scripts/dispatch_publication_contract.py --scope complete "$(git rev-parse HEAD)"
