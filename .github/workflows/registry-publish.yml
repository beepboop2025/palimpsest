name: Publish deployed Palimpsest MCP to Registry

# Registry publication is a separate, SHA-addressed release transaction. The
# selected commit must still be the exact origin/main tip and must have a receipt
# artifact from a successful deploy-mcp run for the same SHA and server version.
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact deployed current-main SHA to publish
        required: true
        type: string
      deploy_run_id:
        description: Successful deploy-mcp workflow run carrying the matching receipt
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: palimpsest-mcp-registry
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: "1.8.1"
  MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
  PUBLIC_MCP_URL: https://api.seiche.info/palimpsest/mcp
  REGISTRY_VERSIONS_URL: https://registry.modelcontextprotocol.io/v0.1/servers/io.github.beepboop2025%2Fpalimpsest/versions
  REGISTRY_LATEST_URL: https://registry.modelcontextprotocol.io/v0.1/servers/io.github.beepboop2025%2Fpalimpsest/versions/latest

jobs:
  mcp-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind publication to exact clean current main
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          timeout --kill-after=5s 120s \
            git fetch --force --no-tags origin \
              '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"

      - name: Prove successful deployment run and matching receipt
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_json="$RUNNER_TEMP/deploy-run.json"
          curl --disable --fail --silent --show-error \
            --proto '=https' --tlsv1.2 --max-time 20 --max-filesize 1048576 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOY_RUN_ID}" \
            --output "$run_json"
          run_attempt=$(python3 -c \
            'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8"))["run_attempt"]; assert type(value) is int and value >= 1; print(value)' \
            "$run_json")
          receipt_dir="$RUNNER_TEMP/deployment-receipt"
          install -d -m 0700 "$receipt_dir"
          gh run download "$DEPLOY_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "palimpsest-mcp-deployment-${TARGET_SHA}-run-${DEPLOY_RUN_ID}-attempt-${run_attempt}" \
            --dir "$receipt_dir"
          python3 ops/mcp-deploy/verify_registry_release.py deployment \
            --receipt "$receipt_dir/deployment-receipt.json" \
            --run-json "$run_json" \
            --manifest server.json \
            --target-sha "$TARGET_SHA" \
            --deploy-run-id "$DEPLOY_RUN_ID" \
            --repository "$GITHUB_REPOSITORY"
          test -z "$(git status --porcelain)"

      - name: Re-probe the deployed public endpoint
        run: |
          set -euo pipefail
          python3 scripts/smoke_palimpsest_mcp.py \
            --url "$PUBLIC_MCP_URL" \
            --module mcp/palimpsest_mcp.py \
            --manifest server.json \
            --timeout 20
          test -z "$(git status --porcelain)"

      - name: Preflight the exact immutable Registry version
        id: registry_preflight
        run: |
          set -euo pipefail
          version=$(python3 -c \
            'import json; print(json.load(open("server.json", encoding="utf-8"))["version"])')
          version_json="$RUNNER_TEMP/registry-version.json"
          version_url="${REGISTRY_VERSIONS_URL}/${version}?include_deleted=true"
          if ! http_status=$(curl --disable --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 20 \
            --max-filesize 1048576 \
            --header 'Accept: application/json' \
            --header 'Cache-Control: no-cache' \
            --write-out '%{http_code}' \
            "$version_url" --output "$version_json"); then
            echo 'could not establish exact Registry version state' >&2
            exit 1
          fi
          case "$http_status" in
            200)
          python3 - "$version_json" <<'PY'
          import json
          import sys

          def reject_constant(value):
              raise ValueError(f"non-finite JSON number: {value}")

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          def canonical(value):
              return json.dumps(
                  value,
                  allow_nan=False,
                  ensure_ascii=False,
                  separators=(",", ":"),
                  sort_keys=True,
              ).encode("utf-8")

          with open(sys.argv[1], encoding="utf-8") as handle:
              registry = json.load(
                  handle,
                  object_pairs_hook=strict_object,
                  parse_constant=reject_constant,
              )
          with open("server.json", encoding="utf-8") as handle:
              manifest = json.load(
                  handle,
                  object_pairs_hook=strict_object,
                  parse_constant=reject_constant,
              )
          if (
              not isinstance(registry, dict)
              or canonical(registry.get("server")) != canonical(manifest)
          ):
              raise SystemExit(
                  "immutable Registry version exists with different server content"
              )
          official = registry.get("_meta", {}).get(
              "io.modelcontextprotocol.registry/official", {}
          )
          if official.get("status") != "active":
              raise SystemExit("exact Registry version exists but is not active")
          published_at = official.get("publishedAt")
          if not isinstance(published_at, str) or not published_at.strip():
              raise SystemExit("exact Registry version has no publication timestamp")
          PY
              echo 'already_published=true' >>"$GITHUB_OUTPUT"
              echo 'publication_mode=recovered-existing' >>"$GITHUB_OUTPUT"
              ;;
            404)
              rm -f -- "$version_json"
              echo 'already_published=false' >>"$GITHUB_OUTPUT"
              echo 'publication_mode=published' >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "unexpected Registry version response: HTTP $http_status" >&2
              exit 1
              ;;
          esac
          test -z "$(git status --porcelain)"

      - name: Install checksum-pinned mcp-publisher
        if: steps.registry_preflight.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          publisher_dir="$RUNNER_TEMP/mcp-publisher"
          install -d -m 0700 "$publisher_dir"
          curl --disable --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 60 \
            --output "$publisher_dir/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" \
            "$publisher_dir/mcp-publisher.tar.gz" | sha256sum --check --strict -
          tar xzf "$publisher_dir/mcp-publisher.tar.gz" \
            -C "$publisher_dir" mcp-publisher
          chmod 0500 "$publisher_dir/mcp-publisher"
          printf 'publisher=%s\n' "$publisher_dir/mcp-publisher" >>"$GITHUB_ENV"
          test -z "$(git status --porcelain)"

      - name: Authenticate by OIDC and publish exact manifest
        if: steps.registry_preflight.outputs.already_published != 'true'
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          timeout --kill-after=5s 120s \
            git fetch --force --no-tags origin \
              '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$TARGET_SHA"
          "$publisher" validate
          "$publisher" login github-oidc
          "$publisher" publish
          test -z "$(git status --porcelain)"

      - name: Verify official Registry version and exact server card
        run: |
          set -euo pipefail
          registry_json="$RUNNER_TEMP/registry-latest.json"
          for attempt in $(seq 1 12); do
            if curl --disable --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 20 \
              --max-filesize 1048576 \
              --header 'Accept: application/json' \
              --header 'Cache-Control: no-cache' \
              "$REGISTRY_LATEST_URL" --output "$registry_json" && \
              python3 ops/mcp-deploy/verify_registry_release.py published \
                --registry-json "$registry_json" --manifest server.json; then
              break
            fi
            if [[ "$attempt" = 12 ]]; then
              echo 'official Registry did not converge to the published version' >&2
              exit 1
            fi
            sleep 5
          done
          test -z "$(git status --porcelain)"

      - name: Record immutable Registry publication receipt
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
          PUBLICATION_MODE: ${{ steps.registry_preflight.outputs.publication_mode }}
        run: |
          set -euo pipefail
          registry_json="$RUNNER_TEMP/registry-latest.json"
          receipt_dir="$RUNNER_TEMP/palimpsest-mcp-registry-receipt"
          test -s "$registry_json"
          install -d -m 0700 "$receipt_dir"
          install -m 0400 "$registry_json" "$receipt_dir/registry-latest.json"
          python3 - "$registry_json" "$receipt_dir/registry-receipt.json" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys

          def reject_constant(value):
              raise ValueError(f"non-finite JSON number: {value}")

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          def canonical(value):
              return json.dumps(
                  value,
                  allow_nan=False,
                  ensure_ascii=False,
                  separators=(",", ":"),
                  sort_keys=True,
              ).encode("utf-8")

          registry_path, receipt_path = sys.argv[1:]
          with open(registry_path, "rb") as handle:
              registry_raw = handle.read()
          registry = json.loads(
              registry_raw,
              object_pairs_hook=strict_object,
              parse_constant=reject_constant,
          )
          with open("server.json", encoding="utf-8") as handle:
              manifest = json.load(
                  handle,
                  object_pairs_hook=strict_object,
                  parse_constant=reject_constant,
              )
          if canonical(registry.get("server")) != canonical(manifest):
              raise SystemExit("Registry response drifted after verification")
          official = registry.get("_meta", {}).get(
              "io.modelcontextprotocol.registry/official", {}
          )
          if official.get("status") != "active" or official.get("isLatest") is not True:
              raise SystemExit("Registry response is not active and latest")
          published_at = official.get("publishedAt")
          if not isinstance(published_at, str) or not published_at.strip():
              raise SystemExit("Registry response has no publication timestamp")
          deploy_run_id = int(os.environ["DEPLOY_RUN_ID"])
          if deploy_run_id < 1:
              raise SystemExit("deployment run ID is invalid")
          workflow_run_id = int(os.environ["GITHUB_RUN_ID"])
          workflow_run_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          if workflow_run_id < 1 or workflow_run_attempt < 1:
              raise SystemExit("Registry workflow run identity is invalid")
          target_sha = os.environ["TARGET_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", target_sha) is None:
              raise SystemExit("target SHA is invalid")
          publication_mode = os.environ["PUBLICATION_MODE"]
          if publication_mode not in {"published", "recovered-existing"}:
              raise SystemExit("Registry publication mode is invalid")
          receipt = {
              "schema": "palimpsest.mcp-registry-publication-receipt.v2",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": ".github/workflows/registry-publish.yml",
              "workflow_run_id": workflow_run_id,
              "workflow_run_attempt": workflow_run_attempt,
              "target_sha": target_sha,
              "server_name": manifest["name"],
              "server_version": manifest["version"],
              "deploy_run_id": deploy_run_id,
              "publication_mode": publication_mode,
              "registry_latest_url": os.environ["REGISTRY_LATEST_URL"],
              "registry_response_sha256": hashlib.sha256(registry_raw).hexdigest(),
              "official_status": official["status"],
              "official_is_latest": official["isLatest"],
              "published_at": published_at,
          }
          with open(receipt_path, "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, sort_keys=True, separators=(",", ":"))
              handle.write("\n")
          PY
          chmod 0400 "$receipt_dir/registry-receipt.json"
          test -z "$(git status --porcelain)"

      - name: Upload immutable Registry publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: palimpsest-mcp-registry-${{ inputs.target_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/palimpsest-mcp-registry-receipt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
