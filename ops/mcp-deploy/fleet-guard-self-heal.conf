# Installed by fleet-bots ops/fleet-guard.
# A transient failure, such as a full disk, must pause an always-on service,
# never stop it for good. systemd's default gives up after five failures in
# five minutes; on 2026-10-30 that left bots dead after the disk was freed.
# Restarts now back off from 10 seconds to 15 minutes and never stop.
# This silences OnFailure= for crash loops, so fleet-guard reports them.
# The file name sorts after older limits.conf drop-ins on purpose; verify with
#   systemctl show -p StartLimitIntervalUSec <unit>    (expect 0)
[Unit]
StartLimitIntervalSec=0

[Service]
RestartSec=10s
RestartSteps=7
RestartMaxDelaySec=15min
