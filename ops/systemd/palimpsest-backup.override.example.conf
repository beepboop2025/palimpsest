# Copy this file to:
#   /etc/systemd/system/palimpsest-backup.service.d/override.conf
# on nodes whose installed base unit still predates the canonical
# /home/palimpsest layout. The values intentionally match the current base
# unit, so keeping this compatibility drop-in is harmless during an upgrade.

[Unit]
Documentation=
Documentation=file:///home/palimpsest/palimpsest/ops/backup/README.md
ConditionFileIsExecutable=
ConditionFileIsExecutable=/home/palimpsest/palimpsest/ops/backup/palimpsest-backup.sh

[Service]
User=palimpsest
Group=palimpsest
WorkingDirectory=/home/palimpsest/palimpsest
ExecStart=
ExecStart=/home/palimpsest/palimpsest/ops/backup/palimpsest-backup.sh
