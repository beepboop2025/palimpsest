name: Refresh Inside View signal

# What a user INSIDE mainland China actually receives, measured on Globalping's
# consented volunteer probes (jsDelivr) and classified against a same-round
# control arm outside China.
#
# Vantage-insensitive on our side: the probing happens on Globalping's probes,
# not on this runner and not on the box, so this runs correctly from GitHub and
# never touches the box's egress. Stdlib-only, key-less.
#
# PALIMPSEST_LIVE is set here deliberately rather than gated behind a secret.
# The other live-gated collectors probe from OUR egress, which is what that gate
# protects; this one does not. What it consumes is Globalping's public credit
# budget (250/hour unauthenticated), and one current round costs 176 credits.
# GitHub cron can be delayed beyond its nominal hour, so clock offsets cannot
# safely coordinate a second scheduler. The checked-in active-probe owner is
# resolved after checkout and every probe/publish step is gated on that value.
# Queued events can carry an older event SHA, so checkout explicitly resolves
# current `main` before the guard reads the latest observation. The runner then
# fails closed unless that observation is strictly older than 65 minutes (and
# its timestamp is trustworthy), protecting against queued/manual duplicates.

on:
  schedule:
    - cron: "41 */6 * * *"     # every 6 hours, offset from the other signals
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: inside-view-refresh
  cancel-in-progress: false

jobs:
  inside-view:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      PALIMPSEST_LIVE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: main

      - name: Resolve the checked-in active-probe owner
        id: active_probe_owner
        run: echo "inside_view=$(python -m core.active_probe_owner)" >> "$GITHUB_OUTPUT"

      - name: Report delegated ownership
        if: steps.active_probe_owner.outputs.inside_view != 'github'
        run: echo "Inside View is owned by the Hetzner scheduler in this revision; abstaining."

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.active_probe_owner.outputs.inside_view == 'github'
        with:
          python-version: "3.12"

      - name: Measure from inside China and publish the Inside View signal
        if: steps.active_probe_owner.outputs.inside_view == 'github'
        run: python -m scripts.inside_view_pull

      - name: Validate downstream selectors without publishing derived output
        if: steps.active_probe_owner.outputs.inside_view == 'github'
        run: python -B -m scripts.validate_investigation_dependencies

      - name: Read the public surface before pushing it
        if: steps.active_probe_owner.outputs.inside_view == 'github'
        # This repository is served in full by Pages, so the push below is the publication
        # act and this is the last point at which a match can still be stopped. The test
        # workflow cannot cover this commit: it carries [skip ci], and GitHub skips the
        # whole run rather than one job. Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit & push if the signal changed
        if: steps.active_probe_owner.outputs.inside_view == 'github'
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git add readings/inside-view-latest.json readings/inside-view-history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: Inside View refresh ($(date -u +%FT%TZ)) [skip ci]"
            python scripts/push_data_commit.py \
              --check-module scripts.validate_investigation_dependencies
          fi
