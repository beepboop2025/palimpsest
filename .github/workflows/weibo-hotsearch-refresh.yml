name: Refresh Weibo hot-search signal

# The allowed-attention denominator: Sina Weibo hot-search board via the
# MIT-licensed community archive (justjavac/weibo-trending-hot-search,
# hourly captures archived per day, keyless raw fetch). Joined against the
# live DDTI ranking to separate CONTAINED_VISIBLE (deleted yet trending)
# from SUPPRESSED_INVISIBLE (deleted and denied attention). Stdlib-only,
# vantage-insensitive — runs correctly from a GitHub runner.

on:
  schedule:
    - cron: "21 * * * *"      # the upstream archive publishes hourly
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weibo-hotsearch-refresh
  cancel-in-progress: false

jobs:
  weibo-hotsearch:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Pull the hot-search archive and publish the join signal
        run: python -m scripts.weibo_hotsearch_pull

      - name: Validate the signal and every downstream registration
        run: >-
          python -m pytest -q
          tests/test_weibo_hotsearch.py
          tests/test_weibo_hotsearch_pull_publish.py
          tests/test_weibo_hotsearch_terms.py
          tests/test_osint_china.py::test_manifest_covers_the_current_china_latest_feed_inventory
          tests/test_reading_analysis.py::test_every_committed_public_history_is_registered
          tests/test_publication_contract.py

      - name: Read the public surface before pushing it
        # This repository is served in full by Pages, so the push below is the publication
        # act and this is the last point at which a match can still be stopped. The test
        # workflow marks the commit [skip pytest] so Tests/pytest skips; Tests/contract still runs. GitHub does not skip the
        # whole run rather than one job. Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit & push if the signal changed
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git add readings/weibo-hotsearch-latest.json \
                  readings/weibo-hotsearch-history.jsonl \
                  readings/weibo-hotsearch-terms-latest.json \
                  readings/weibo-hotsearch-terms-history.jsonl
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: weibo hot-search signal refresh ($(date -u +%FT%TZ)) [skip pytest]"
            python scripts/push_data_commit.py \
              --rebuild-module scripts.weibo_hotsearch_pull \
              --stage readings/weibo-hotsearch-latest.json \
              --stage readings/weibo-hotsearch-history.jsonl \
              --stage readings/weibo-hotsearch-terms-latest.json \
              --stage readings/weibo-hotsearch-terms-history.jsonl \
              --input-path readings/ddti-latest.json
          fi
