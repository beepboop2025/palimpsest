name: Refresh Generative Firewall Index

# Measure how state-aligned LLMs censor, via public model APIs (OpenRouter).
# Vantage-insensitive: a model refuses the same regardless of where you ask.
# Runs daily because each run spends model quota. The OPENROUTER_API_KEY secret
# is never printed and is NOT exposed here — this workflow only runs on schedule
# and manual dispatch, never on pull_request, so untrusted code can't read it.

on:
  schedule:
    - cron: "23 6 * * *"     # daily, ~06:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gfi-refresh
  cancel-in-progress: false

jobs:
  gfi:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Run the generative-firewall reading
        run: python scripts/generative_firewall_reading.py

      - name: Read the public surface before pushing it
        # This repository is served in full by Pages, so the push below is the publication
        # act and this is the last point at which a match can still be stopped. The test
        # workflow cannot cover this commit: it carries [skip ci], and GitHub skips the
        # whole run rather than one job. Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Commit & push if the reading changed
        run: |
          git config user.name  "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git add readings/latest.json readings/history.jsonl \
                  readings/generative-firewall-index.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: generative firewall refresh ($(date -u +%FT%TZ)) [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
