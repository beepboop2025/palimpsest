name: Refresh board-level judgements

# The public derived edition, all pure local recomputation over the signal
# history JSONLs (no network, stdlib-only, deterministic):
#
#   board alarm    — e-BH selection across all monitored signals plus per-layer
#                    and board-wide merged e-values, so the false-alarm rate a
#                    reader is quoted is the family-wise one rather than twelve
#                    separate per-signal ones.
#   coverage guard — whether each signal's movement survives conditioning on its
#                    own sample size, so a shrinking measurement base is never
#                    published as a censorship change.
#   forecast ledger— the observatory's own track record: every signal forecast one
#                    step ahead from only its past, scored by a proper rule against
#                    what arrived, with the misses named.
#   cross-layer    — whether one layer of the apparatus moves before another, against
#                    a circular-shift null on differenced series (a naive correlation
#                    test on these autocorrelated signals is confidently wrong).
#
# Runs hourly after the evidence wire. Event flags retain their source-driven
# cadence; an hourly edition republishes their explicit age rather than
# pretending an unchanged upstream signal was measured again.

on:
  schedule:
    - cron: "53 * * * *"       # hourly public edition, after event-flags/newswire at :47
  repository_dispatch:
    types:
      - publication_graph_dirty
  workflow_dispatch:
    inputs:
      publication_retry:
        description: Base-advance retry number
        required: false
        default: "0"
      publication_request:
        description: Original scheduled run ID
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  # Source-dirty events are level-triggered: each run closes the latest main, not
  # merely the SHA that requested it. Default pending-run coalescing keeps a burst
  # of publication_graph_dirty events bounded while this group serializes the
  # non-wire graph publishers.
  group: derived-graph-publish
  cancel-in-progress: false

jobs:
  board-alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Synchronize the edition base
        run: |
          git config user.name "palimpsest-bot"
          git config user.email "bot@palimpsest.info"
          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main"
          git switch --detach origin/main

      - name: Validate the source-dirty request
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          DIRTY_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "${#DIRTY_SHA}" -ne 40 ] ||
             [ -n "${DIRTY_SHA//[0-9a-f]/}" ]; then
            echo "invalid publication_graph_dirty SHA payload" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$DIRTY_SHA" origin/main; then
            echo "publication_graph_dirty SHA is not reachable from main" >&2
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the pinned offline test runner
        run: >-
          python -m pip install --quiet --require-hashes
          -r .github/osint-china-ci-requirements.txt

      - name: Recompute the board alarm from signal histories
        run: python -m scripts.board_alarm_pull

      - name: Recompute the coverage guard from signal histories
        run: python -m scripts.coverage_guard_pull

      - name: Rescore the forecast ledger
        run: python -m scripts.forecast_ledger_pull

      - name: Recompute cross-layer lead/lag
        run: python -m scripts.cross_layer_pull

      - name: Seal the weekly situation report
        run: python -m scripts.weekly_situation_pull

      - name: Publish collector health
        run: python -m scripts.collector_health_pull

      - name: Publish gazetteer phylogeny
        run: python -m scripts.gazetteer_phylogeny_pull

      - name: Rebuild and seal every downstream derived surface
        run: |
          publish_clock=$(date -u +%FT%TZ)
          base_commit=$(git rev-parse HEAD)
          python -m scripts.build_economic_pulse --as-of "$publish_clock"
          python -m scripts.build_china_econ_manifest
          python -m scripts.build_china_econ_forecast
          python -m scripts.build_china_site
          python -m scripts.undertext_pull
          python -m scripts.build_erasure_trail
          python -m scripts.build_erasure_trail --check
          python -m scripts.build_osint_china --now "$publish_clock" --input-commit "$base_commit"
          python -m scripts.build_investigations --as-of "$publish_clock"
          python -m scripts.build_network_rounds
          python -m scripts.build_corroboration
          python -m scripts.build_editorial_readiness
          python -m scripts.sync_narcoscope --check
          python -m core.evidence_mesh --now "$publish_clock"
          python -m core.machine_investigations --as-of "$publish_clock"
          python -m scripts.build_newsroom
          python -m scripts.build_china_situation
          python -m scripts.build_data_catalog --now "$publish_clock"
          python scripts/seal_readings.py

      - name: Verify the complete downstream graph before publication
        run: |
          publish_clock=$(python -c 'import json; print(json.load(open("readings/osint-china-latest.json"))["generated_at"])')
          base_commit=$(python -c 'import json; print(json.load(open("readings/osint-china-latest.json"))["input_commit"])')
          python -m scripts.build_economic_pulse --check --as-of "$publish_clock"
          python -m scripts.build_china_econ_manifest --check
          python -m scripts.build_china_econ_forecast --check
          python -m scripts.build_china_site --check
          python -m scripts.undertext_pull --check
          sha256sum readings/osint-china-latest.json > "$RUNNER_TEMP/osint-before.sha256"
          python -m scripts.build_erasure_trail
          python -m scripts.build_erasure_trail --check
          python -m scripts.build_osint_china --now "$publish_clock" --input-commit "$base_commit"
          sha256sum readings/osint-china-latest.json > "$RUNNER_TEMP/osint-after.sha256"
          cmp "$RUNNER_TEMP/osint-before.sha256" "$RUNNER_TEMP/osint-after.sha256"
          python -m scripts.build_investigations --check --as-of "$publish_clock"
          python -m scripts.build_network_rounds --check
          python -m scripts.build_corroboration --check
          python -m scripts.build_editorial_readiness --check
          python -m core.evidence_mesh --check
          python -m core.machine_investigations --check
          python -m scripts.build_newsroom --check
          python -m scripts.build_china_situation --check
          python -m scripts.build_data_catalog --check
          catalog_clock=$(python -c 'import json; print(json.load(open("readings/catalog.json"))["generated_at"])')
          sha256sum readings/catalog.json readings/catalog.jsonld datapackage.json > "$RUNNER_TEMP/catalog-before.sha256"
          python -m scripts.build_data_catalog --now "$catalog_clock"
          sha256sum readings/catalog.json readings/catalog.jsonld datapackage.json > "$RUNNER_TEMP/catalog-after.sha256"
          cmp "$RUNNER_TEMP/catalog-before.sha256" "$RUNNER_TEMP/catalog-after.sha256"
          python scripts/seal_readings.py --check

      - name: Validate the complete public edition
        run: >-
          python -m pytest -q
          tests/test_board_alarm.py
          tests/test_coverage_guard.py
          tests/test_forecast_ledger.py
          tests/test_cross_layer.py
          tests/test_weekly_situation.py
          tests/test_collector_health.py
          tests/test_gazetteer_phylogeny.py
          tests/test_economic_pulse.py
          tests/test_undertext.py
          tests/test_undertext_pull_publish.py
          tests/test_event_analysis.py
          tests/test_event_analysis_v2.py
          tests/test_newsroom_publication_integrity.py
          tests/test_osint_china.py
          tests/test_investigations.py
          tests/test_network_rounds.py
          tests/test_corroboration.py
          tests/test_editorial_readiness.py
          tests/test_publication_contract.py

      - name: Read the public surface before pushing it
        # The push below advances auditable Git state; Pages deploys only an exact
        # SHA after its complete-graph contract passes, so this is the pre-push
        # boundary and this is the last point at which a match can still be stopped. The test
        # publisher marks [skip pytest] to identify the contract-only lane, then dispatches
        # the exact accepted SHA because action-token pushes emit no ordinary push event.
        # Without the rule list configured this reports and
        # exits 0, on purpose: a check that stops the refresh when a secret is absent
        # stops the observatory, and stops it silently.
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: python scripts/verify_public_surface.py

      - name: Create the exact-parent publication candidate
        id: candidate
        env:
          PALIMPSEST_SCRUB_STRINGS: ${{ secrets.PALIMPSEST_SCRUB_STRINGS }}
        run: |
          git add -A -- readings china news datapackage.json weekly-situation.html
          if git diff --cached --quiet; then
            echo "no change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: board alarm + coverage guard refresh ($(date -u +%FT%TZ)) [skip pytest]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recertify an unchanged complete publication
        if: steps.candidate.outputs.changed == 'false'
        env:
          PALIMPSEST_ACTIONS_TOKEN: ${{ github.token }}
        run: >-
          python scripts/dispatch_publication_contract.py
          --scope complete "$(git rev-parse HEAD)"

      - name: Attempt the base-locked publication
        if: steps.candidate.outputs.changed == 'true'
        id: publish
        continue-on-error: true
        run: |
          set +e
          PALIMPSEST_ACTIONS_TOKEN="${{ github.token }}" python scripts/push_data_commit.py --base-locked --contract-scope complete
          publish_rc=$?
          set -e
          printf 'exit_code=%s\n' "$publish_rc" >> "$GITHUB_OUTPUT"
          exit "$publish_rc"

      - name: Refuse a non-race publication failure
        if: >-
          steps.publish.outcome == 'failure' &&
          steps.publish.outputs.exit_code != '75' &&
          steps.publish.outputs.exit_code != '76'
        run: |
          echo "FATAL: board publication failed for a reason that is not a base advance"
          exit 1

      - name: Retry the exact contract event without rebuilding
        if: >-
          steps.publish.outcome == 'failure' &&
          steps.publish.outputs.exit_code == '76'
        env:
          PALIMPSEST_ACTIONS_TOKEN: ${{ github.token }}
        run: python scripts/dispatch_publication_contract.py --scope complete "$(git rev-parse HEAD)"

      - name: Queue a bounded rebuild from the latest main
        if: >-
          steps.publish.outcome == 'failure' &&
          steps.publish.outputs.exit_code == '75'
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_ATTEMPT: ${{ inputs.publication_retry || '0' }}
          REQUEST_RUN_ID: ${{ inputs.publication_request || github.run_id }}
          MAX_RETRIES: "3"
        run: |
          set -euo pipefail

          case "$RETRY_ATTEMPT" in
            ''|*[!0-9]*)
              echo "FATAL: invalid publication retry number"
              exit 2
              ;;
          esac

          case "$REQUEST_RUN_ID" in
            ''|*[!0-9]*)
              REQUEST_RUN_ID="$GITHUB_RUN_ID"
              ;;
          esac

          if [ "$RETRY_ATTEMPT" -ge "$MAX_RETRIES" ]; then
            echo "FATAL: board publication exhausted its bounded rebuild dispatches"
            exit 75
          fi

          next_attempt=$((RETRY_ATTEMPT + 1))
          gh workflow run board-alarm-refresh.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f publication_retry="$next_attempt" \
            -f publication_request="$REQUEST_RUN_ID"

          {
            echo "Base-advance race detected."
            echo "Queued retry $next_attempt/$MAX_RETRIES for request $REQUEST_RUN_ID."
          } >> "$GITHUB_STEP_SUMMARY"

          # This run did not publish; the accepted retry is a separate run.
          exit 75
